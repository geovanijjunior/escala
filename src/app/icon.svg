<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Jornada">
  <!--
    O "Encaixe" da marca, nas mesmas proporções de Marca.tsx (ficha 32 → símbolo
    16 → bloco 9,85). Aqui é SVG, e não CSS, porque um favicon não tem DOM.

    Existe também para calar um 404: sem `icon` nenhum, o navegador pede
    /favicon.ico em toda página e leva 404 — barulho que aparecia na varredura
    como se fosse erro do sistema.
  -->
  <rect width="32" height="32" rx="7" fill="#0B2D5B"/>
  <rect x="8" y="8" width="9.85" height="9.85" rx="1.6" fill="#FFFFFF"/>
  <rect x="14.15" y="14.15" width="9.85" height="9.85" rx="1.6" fill="#7FB0FF"/>
</svg>
