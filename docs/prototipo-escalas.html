   ============================================================ */
const agora = () => new Date().toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });

function gravarGeracao(resultado, escopo) {
  const ant = geracao();
  S.geracoes[S.competencia] = {
    versao: (ant?.versao || 0) + 1, status: 'rascunho', escopo,
    geradaEm: agora(), geradaPor: PAPEIS[S.papel].nome,
    alocacoes: resultado.alocacoes.map(a => ({ ...a, travado: S.pins.some(p => p.colaboradorId === a.colaboradorId && p.data === a.data) })),
    conflitos: resultado.conflitos, alertas: resultado.alertas,
    aderencia: resultado.aderencia, capacidadeDia: resultado.capacidadeDia,
  };
}

/** Efeito real da aprovação: grava trava + ajusta a alocação do dia. */
function aplicarNaEscala(s) {
  const g = geracao();
  const travar = (colabId, data, modalidade, unidadeId) => {
    S.pins = S.pins.filter(p => !(p.colaboradorId === colabId && p.data === data));
    S.pins.push({ colaboradorId: colabId, data, modalidade, unidadeId });
    if (!g) return;
    const a = g.alocacoes.find(x => x.colaboradorId === colabId && x.data === data);
    if (a) { a.modalidade = modalidade; a.unidadeId = unidadeId; a.travado = true; }
  };

  if (s.tipo === 'TROCA_UNIDADE' && s.unidadeDesejadaId) {
    travar(s.colaboradorId, s.data, 'UNIDADE', s.unidadeDesejadaId);
    return `Alocação de ${fmData(s.data)} movida para ${unidadePorId.get(s.unidadeDesejadaId).nome} e travada.`;
  }
  if (s.tipo === 'TROCA_HORARIO' && s.parceiroId && g) {
    const meu = g.alocacoes.find(a => a.colaboradorId === s.colaboradorId && a.data === s.data);
    const dele = g.alocacoes.find(a => a.colaboradorId === s.parceiroId && a.data === s.data);
    if (!meu || !dele) return '';
    const mm = { m: meu.modalidade, u: meu.unidadeId }, dd = { m: dele.modalidade, u: dele.unidadeId };
    travar(s.colaboradorId, s.data, dd.m, dd.u);
    travar(s.parceiroId, s.data, mm.m, mm.u);
    for (const id of [s.colaboradorId, s.parceiroId]) {
      S.ocorrencias.push({ id: ++S.seq, colaboradorId: id, data: s.data, tipo: 'TROCA', minutos: 0, obs: `Troca aprovada (solicitação #${s.id})` });
    }
    return `Plantões de ${fmData(s.data)} trocados entre os dois colaboradores.`;
  }
  if (s.tipo === 'FOLGA' || s.tipo === 'FERIAS') {
    const tipo = s.tipo === 'FERIAS' ? 'FERIAS' : 'AUSENCIA';
    const coberto = S.ausencias.some(a => a.colaboradorId === s.colaboradorId && a.inicio <= s.data && fimAusencia(a.inicio, a.dias) >= s.data);
    if (!coberto) {
      S.ausencias.push({ id: ++S.seq, colaboradorId: s.colaboradorId, tipo, inicio: s.data, dias: 1,
        grupo: tipo === 'AUSENCIA' ? 'Folga' : '', motivo: tipo === 'AUSENCIA' ? 'Compensação' : '' });
    }
    travar(s.colaboradorId, s.data, s.tipo === 'FERIAS' ? 'FERIAS' : 'FOLGA', null);
    return `${fmData(s.data)} lançado como ${s.tipo === 'FERIAS' ? 'férias' : 'ausência'} e travado na escala.`;
  }
  return '';
}

const TRANSICOES = {
  ACEITAR_PARCEIRO: { de: ['AGUARDA_PARCEIRO'], para: 'TRIAGEM',  etapa: 'Aceita pelo parceiro' },
  RECUSAR_PARCEIRO: { de: ['AGUARDA_PARCEIRO'], para: 'RECUSADA', etapa: 'Recusada pelo parceiro', motivo: true },
  ENCAMINHAR:       { de: ['TRIAGEM'], para: 'GESTOR',   etapa: 'Encaminhada ao gestor' },
  FILA:             { de: ['TRIAGEM'], para: 'FILA',     etapa: 'Enviada para a lista de espera' },
  PROMOVER:         { de: ['FILA'],    para: 'GESTOR',   etapa: 'Promovida da lista de espera' },
  RECUSAR_TRIAGEM:  { de: ['TRIAGEM'], para: 'RECUSADA', etapa: 'Recusada na triagem', motivo: true },
  APROVAR:          { de: ['GESTOR'],  para: 'APROVADA', etapa: 'Aprovada pelo gestor' },
  RECUSAR_GESTOR:   { de: ['GESTOR'],  para: 'RECUSADA', etapa: 'Recusada pelo gestor', motivo: true },
};

function decidir(id, op, motivo) {
  const s = S.solicitacoes.find(x => x.id === id);
  const r = TRANSICOES[op];
  if (!s || !r || !r.de.includes(s.status)) { S.recado = { erro: true, msg: 'Essa solicitação não aceita mais essa ação.' }; return; }
  if (r.motivo && (!motivo || motivo.trim().length < 5)) { S.recado = { erro: true, msg: 'Uma recusa precisa de justificativa.' }; return; }

  const eraFila = s.status === 'FILA';
  let efeito = '';
  if (op === 'APROVAR') { efeito = aplicarNaEscala(s); s.aplicada = !!efeito; }
  if (op === 'ACEITAR_PARCEIRO') s.aceiteParceiro = 'ACEITO';
  if (op === 'RECUSAR_PARCEIRO') s.aceiteParceiro = 'RECUSADO';
  if (r.motivo) s.motivoRecusa = motivo.trim();
  if (op === 'FILA') s.posicaoFila = Math.max(0, ...S.solicitacoes.filter(x => x.status === 'FILA').map(x => x.posicaoFila || 0)) + 1;
  if (op === 'PROMOVER' || r.para === 'RECUSADA' || r.para === 'APROVADA') delete s.posicaoFila;

  s.status = r.para;
  s.eventos.push({ etapa: r.etapa, por: PAPEIS[S.papel].nome, em: agora(), detalhe: motivo || efeito || (op === 'APROVAR' ? 'Este tipo não altera a escala — vale como registro formal.' : '') });

  // Ao sair da fila, renumera quem ficou para trás.
  if (op === 'PROMOVER' || (eraFila && r.para === 'RECUSADA')) {
    S.solicitacoes.filter(x => x.status === 'FILA').sort((a, b) => (a.posicaoFila || 99) - (b.posicaoFila || 99))
      .forEach((x, i) => { x.posicaoFila = i + 1; });
  }
  S.recado = { erro: false, msg: efeito ? `${r.etapa}. ${efeito}` : `${r.etapa}.` };
}

/* ============================================================
   EVENTOS
   ============================================================ */
document.addEventListener('click', ev => {
  const alvo = ev.target.closest('[data-tela],[data-ir],[data-acao],[data-dia],[data-vista],[data-aba],[data-plano],[data-mes],[data-un],[data-fixa]');
  if (!alvo) return;
  const d = alvo.dataset;

  if (d.fixa !== undefined) {
    const dow = Number(d.fixa);
    if (d.fixaun === '') delete fixasEdit[dow];
    else fixasEdit[dow] = Number(d.fixaun);
    return desenharFixas();
  }

  if (d.tela || d.ir) { ev.preventDefault(); S.tela = d.tela || d.ir; S.dia = null; S.colabAberto = null; distEdit = {}; fixasEdit = {}; return render(); }
  if (d.vista) { S.vista = d.vista; return render(); }
  if (d.aba) { S.aba = d.aba; return render(); }
  if (d.mes !== undefined && !d.acao) {
    const [a, m] = partesIso(S.competencia);
    const dt = new Date(a, m + Number(d.mes), 1);
    S.competencia = iso(dt.getFullYear(), dt.getMonth(), 1);
    S.dia = null;
    if (!S.planos[S.competencia]) S.planos[S.competencia] = montarPlanos(S.competencia);
    return render();
  }
  if (d.plano) {
    S.colabAberto = Number(d.plano);
    const p = planosDoMes().find(x => x.colaboradorId === S.colabAberto);
    distEdit = {};
    fixasEdit = p ? { ...p.unidadesFixas } : {};
    S.rolarAoEditor = true;
    return render();
  }
  if (d.un !== undefined && d.pct !== undefined) {
    const un = Number(d.un), pct = Number(d.pct);
    if (UNIDADES.length === 2) {
      const outra = UNIDADES.find(u => u.id !== un);
      distEdit = { [un]: pct, [outra.id]: 100 - pct };
    } else distEdit[un] = pct;
    return atualizarSoma();
  }
  if (d.dia && !d.acao) { S.dia = S.dia === d.dia ? null : d.dia; return render(); }

  const acoes = {
    simular() {
      const r = gerarEscala(contexto());
      S.simulacao = { resultado: r, escopo: 'Mês completo', travas: [] };
    },
    'simular-parcial'() {
      const eqs = [...document.querySelectorAll('.eq-parcial:checked')].map(i => Number(i.value));
      const de = document.getElementById('parcial-de').value;
      const ate = document.getElementById('parcial-ate').value;
      const g = geracao();
      const travas = S.pins.slice();
      if (g) {
        for (const a of g.alocacoes) {
          const c = colabPorId.get(a.colaboradorId);
          const foraEq = eqs.length && !eqs.includes(c.equipeId);
          const foraJanela = (de && a.data < de) || (ate && a.data > ate);
          if (foraEq || foraJanela) travas.push({ colaboradorId: a.colaboradorId, data: a.data, modalidade: a.modalidade, unidadeId: a.unidadeId });
        }
      }
      const ctx = { ...contexto(), pins: travas };
      const escopo = `Parcial — ${eqs.length ? EQUIPES.filter(e => eqs.includes(e.id)).map(e => e.nome).join(', ') : 'todas as equipes'} · ${de || ate ? `${de ? fmData(de) : 'início'} a ${ate ? fmData(ate) : 'fim'}` : 'mês inteiro'}`;
      S.simulacao = { resultado: gerarEscala(ctx), escopo, travas };
    },
    'confirmar-sim'() {
      const sim = S.simulacao;
      gravarGeracao(sim.resultado, sim.escopo);
      S.simulacao = null;
      S.recado = { erro: false, msg: `Escala gravada como rascunho (versão ${geracao().versao}). Publique quando estiver revisada.` };
      S.tela = 'calendario';
    },
    'descartar-sim'() { S.simulacao = null; S.recado = { erro: false, msg: 'Simulação descartada. Nada foi gravado.' }; },
    'liberar-travas'() { const n = S.pins.length; S.pins = []; S.recado = { erro: false, msg: `${n} trava(s) liberada(s). A próxima geração decide tudo de novo.` }; },
    status() {
      const g = geracao();
      g.status = d.alvo;
      S.recado = { erro: false, msg: d.alvo === 'publicada' ? 'Escala publicada — agora visível para os colaboradores.' : 'Mês encerrado. Não aceita mais alterações.' };
    },
    'fechar-dia'() { S.dia = null; },
    'fechar-plano'() { S.colabAberto = null; distEdit = {}; fixasEdit = {}; },
    travar() {
      const g = geracao(), colabId = Number(d.colab);
      const a = g.alocacoes.find(x => x.colaboradorId === colabId && x.data === S.dia);
      const existe = S.pins.some(p => p.colaboradorId === colabId && p.data === S.dia);
      if (existe) { S.pins = S.pins.filter(p => !(p.colaboradorId === colabId && p.data === S.dia)); a.travado = false; S.recado = { erro: false, msg: 'Trava removida.' }; }
      else { S.pins.push({ colaboradorId: colabId, data: S.dia, modalidade: a.modalidade, unidadeId: a.unidadeId }); a.travado = true; S.recado = { erro: false, msg: 'Alocação travada — sobrevive à próxima regeração.' }; }
    },
    mover() {
      const colabId = Number(d.colab);
      const destino = document.querySelector(`[data-mover="${colabId}"]`).value;
      const [modalidade, un] = destino.split(':');
      const unidadeId = modalidade === 'UNIDADE' ? Number(un) : null;
      const g = geracao();
      const a = g.alocacoes.find(x => x.colaboradorId === colabId && x.data === S.dia);
      a.modalidade = modalidade; a.unidadeId = unidadeId; a.travado = true;
      S.pins = S.pins.filter(p => !(p.colaboradorId === colabId && p.data === S.dia));
      S.pins.push({ colaboradorId: colabId, data: S.dia, modalidade, unidadeId });
      S.recado = { erro: false, msg: `${colabPorId.get(colabId).nome} movido e travado em ${fmData(S.dia)}.` };
    },
    ocorrencia() {
      const colabId = Number(document.getElementById('oc-colab').value);
      S.ocorrencias.push({ id: ++S.seq, colaboradorId: colabId, data: S.dia,
        tipo: document.getElementById('oc-tipo').value,
        minutos: Number(document.getElementById('oc-min').value) || 0,
        obs: document.getElementById('oc-obs').value.trim() });
      S.recado = { erro: false, msg: 'Ocorrência registrada.' };
    },
    decidir() { decidir(Number(d.id), d.op); },
    recusar() {
      const motivo = prompt('Justificativa da recusa (obrigatória — é o que a pessoa vai ler):');
      if (motivo === null) return;
      decidir(Number(d.id), d.op, motivo);
    },
    'salvar-plano'() {
      const colabId = Number(d.colab);
      const c = colabPorId.get(colabId);
      const soma = UNIDADES.reduce((a, u) => a + (distEdit[u.id] || 0), 0);
      if (soma !== 100) { S.recado = { erro: true, msg: `A distribuição soma ${soma}% — precisa somar exatamente 100%.`, onde: 'plano' }; return; }
      const modo = document.querySelector('.ed-homodo:checked')?.value || '';
      const marcados = cls => [...document.querySelectorAll(cls + ':checked')].map(i => Number(i.value));
      const ciclo = document.querySelector('.ed-ciclo:checked')?.value || null;
      if (c.regime === '12x36' && !ciclo) { S.recado = { erro: true, msg: 'Regime 12x36 exige definir o ciclo do mês.', onde: 'plano' }; return; }
      const diasFixos = marcados('.ed-hofixo');
      if (modo === 'FIXO' && !diasFixos.length) { S.recado = { erro: true, msg: 'Home office fixo precisa de ao menos um dia da semana.', onde: 'plano' }; return; }

      // Um dia não pode estar preso a uma unidade e ser home office ao mesmo
      // tempo — o motor teria duas regras rígidas se contradizendo.
      if (modo === 'FIXO') {
        const choque = diasFixos.filter(dw => fixasEdit[dw] !== undefined);
        if (choque.length) {
          S.recado = { erro: true, msg: `${listar(choque.map(dw => DIAS_LONGOS[dw].toLowerCase()))} está marcado como home office fixo e como unidade fixa ao mesmo tempo. Escolha um dos dois.`, onde: 'plano' };
          return;
        }
      }

      const lista = S.planos[S.competencia];
      const i = lista.findIndex(p => p.colaboradorId === colabId);
      const novo = {
        colaboradorId: colabId, competencia: S.competencia,
        ciclo: c.regime === '12x36' ? ciclo : null,
        distribuicao: { ...distEdit }, unidadesFixas: { ...fixasEdit },
        homeOffice: {
          modo: modo || null, diasSemana: modo === 'FIXO' ? diasFixos : [],
          quantidade: modo === 'COTA' ? Number(document.querySelector('.ed-hoqtd').value) || 1 : 0,
          diasPreferencia: modo === 'COTA' ? marcados('.ed-hopref') : [],
          diasProibidos: modo === 'COTA' ? marcados('.ed-hoproib') : [],
        },
      };
      if (i >= 0) lista[i] = novo; else lista.push(novo);
      S.recado = { erro: false, msg: `Plano de ${c.nome} salvo. A escala já gerada não muda — é preciso gerar de novo.` };
      S.colabAberto = null; distEdit = {}; fixasEdit = {};
    },
    'add-ausencia'() {
      const tipo = document.getElementById('au-tipo').value;
      const inicio = document.getElementById('au-inicio').value;
      const dias = Number(document.getElementById('au-dias').value);
      if (!inicio) { S.recado = { erro: true, msg: 'Informe a data de início da ausência.', onde: 'ausencia', foco: 'au-inicio' }; return; }
      if (!(dias >= 1)) { S.recado = { erro: true, msg: 'A quantidade de dias precisa ser ao menos 1.', onde: 'ausencia', foco: 'au-dias' }; return; }
      const fim = fimAusencia(inicio, dias);
      const choque = S.ausencias.find(a => a.colaboradorId === S.colabAberto && inicio <= fimAusencia(a.inicio, a.dias) && a.inicio <= fim);
      if (choque) { S.recado = { erro: true, msg: `Já existe uma ausência entre ${fmData(choque.inicio)} e ${fmData(fimAusencia(choque.inicio, choque.dias))} que se sobrepõe a esse período.`, onde: 'ausencia', foco: 'au-inicio' }; return; }
      S.ausencias.push({ id: ++S.seq, colaboradorId: S.colabAberto, tipo, inicio, dias,
        grupo: tipo === 'AUSENCIA' ? document.getElementById('au-grupo').value : '',
        motivo: tipo === 'AUSENCIA' ? document.getElementById('au-motivo').value : '' });
      S.recado = { erro: false, msg: `Ausência de ${fmData(inicio)} a ${fmData(fim)} lançada.`, onde: 'ausencia' };
    },
    'rm-ausencia'() { S.ausencias = S.ausencias.filter(a => a.id !== Number(d.id)); S.recado = { erro: false, msg: 'Ausência removida.', onde: 'ausencia' }; },
    'abrir-solic'() {
      const eu = euSou();
      const tipo = document.getElementById('ns-tipo').value;
      const data = document.getElementById('ns-data').value;
      const detalhe = document.getElementById('ns-detalhe').value.trim();
      if (!data) { S.recado = { erro: true, msg: 'Informe a data de referência.' }; return; }
      if (detalhe.length < 5) { S.recado = { erro: true, msg: 'Descreva a justificativa da solicitação.' }; return; }
      const extra = document.getElementById('ns-extra').value;
      if (tipo === 'TROCA_HORARIO' && !extra) { S.recado = { erro: true, msg: 'Não há colega elegível para a troca.' }; return; }
      const s = {
        id: ++S.seq, colaboradorId: eu.id, tipo, data, detalhe,
        status: tipo === 'TROCA_HORARIO' ? 'AGUARDA_PARCEIRO' : 'TRIAGEM', aplicada: false,
        criadoEm: new Date().toISOString().slice(0, 16),
        eventos: [{ etapa: 'Aberta', por: eu.nome, em: agora(), detalhe: `${TIPOS_SOLICITACAO[tipo].label} para ${fmData(data)}` }],
      };
      if (tipo === 'TROCA_HORARIO') { s.parceiroId = Number(extra); s.aceiteParceiro = 'PENDENTE'; }
      if (tipo === 'TROCA_UNIDADE') s.unidadeDesejadaId = Number(extra);
      S.solicitacoes.unshift(s);
      S.recado = { erro: false, msg: tipo === 'TROCA_HORARIO'
        ? 'Solicitação enviada. Troque para o papel Colaborador do colega convidado para ver o aceite.'
        : 'Solicitação enviada e aguardando triagem do Planejamento.' };
    },
    'csv-grade'() {
      const g = geracao();
      const [ano, mes] = partesIso(S.competencia);
      const nDias = diasNoMes(ano, mes);
      const dias = Array.from({ length: nDias }, (_, i) => i + 1);
      // O CSV sai igual ao que está na tela — exportar mais do que se vê
      // costuma ser descoberto tarde, depois de já ter sido enviado.
      const fc = S.fCal;
      const buscaCsv = fc.q.trim().toLowerCase();
      const pessoas = visiveis().filter(c => {
        if (c.status !== 'ativo') return false;
        if (fc.equipe && c.equipeId !== Number(fc.equipe)) return false;
        if (fc.turno && c.turno !== fc.turno) return false;
        if (buscaCsv && !`${c.nome} ${c.cargo}`.toLowerCase().includes(buscaCsv)) return false;
        return true;
      });
      const porChave = new Map(g.alocacoes.map(a => [`${a.colaboradorId}|${a.data}`, a]));
      baixarCsv([
        ['Colaborador', 'Matrícula', 'Equipe', 'Cargo', 'Entrada', ...dias.map(String), ...UNIDADES.map(u => u.sigla), 'HO'],
        ...pessoas.map(c => {
          const t = { 1: 0, 2: 0, HOME: 0 };
          const cels = dias.map(dd => {
            const a = porChave.get(`${c.id}|${iso(ano, mes, dd)}`);
            if (!a || a.modalidade === 'DESCANSO') return '';
            if (a.modalidade === 'UNIDADE') t[a.unidadeId]++; else if (a.modalidade === 'HOME') t.HOME++;
            return apar(a.modalidade, a.unidadeId).sigla;
          });
          return [c.nome, c.matricula, equipePorId.get(c.equipeId).nome, c.cargo, c.entrada, ...cels, String(t[1]), String(t[2]), String(t.HOME)];
        }),
      ], `escala-${S.competencia.slice(0, 7)}.csv`);
      return 'sem-render';
    },
    'csv-ocupacao'() {
      const g = geracao();
      baixarCsv([
        ['Data', 'Colaborador', 'Matrícula', 'Equipe', 'Cargo', 'Modalidade', 'Entrada', 'Turno'],
        ...g.alocacoes.filter(a => a.modalidade !== 'DESCANSO').map(a => {
          const c = colabPorId.get(a.colaboradorId);
          return [fmData(a.data), c.nome, c.matricula, equipePorId.get(c.equipeId).nome, c.cargo,
            a.modalidade === 'UNIDADE' ? unidadePorId.get(a.unidadeId).nome : MODALIDADES[a.modalidade].label,
            c.entrada, c.turno === 'N' ? 'Noturno' : 'Diurno'];
        }),
      ], `ocupacao-${S.competencia.slice(0, 7)}.csv`);
      return 'sem-render';
    },
  };

  if (d.acao && acoes[d.acao]) {
    ev.preventDefault();
    if (acoes[d.acao]() !== 'sem-render') render();
  }
});

/** Filtros reagem enquanto se digita, sem botão "Filtrar". */
function aplicarFiltro(t) {
  const campo = t.dataset.filtro;
  if (!campo) return false;
  const alvo = campo.startsWith('fp-') ? S.fPlanos : S.fCal;
  const chave = campo.slice(3);
  alvo[chave] = t.type === 'checkbox' ? t.checked : t.value;
  render();
  return true;
}

document.addEventListener('input', ev => {
  if (ev.target.dataset && ev.target.dataset.filtro) aplicarFiltro(ev.target);
});

document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.dataset && t.dataset.filtro) return aplicarFiltro(t);
  if (t.id === 'papel') { S.papel = t.value; S.dia = null; S.colabAberto = null; S.aba = 'abertas'; return render(); }
  if (t.classList.contains('mes-sel') || t.classList.contains('ano-sel')) {
    const [ano, mes] = partesIso(S.competencia);
    const novoMes = t.classList.contains('mes-sel') ? Number(t.value) : mes;
    const novoAno = t.classList.contains('ano-sel') ? Number(t.value) : ano;
    S.competencia = iso(novoAno, novoMes, 1);
    S.dia = null;
    if (!S.planos[S.competencia]) S.planos[S.competencia] = montarPlanos(S.competencia);
    return render();
  }
  if (t.classList.contains('ed-homodo')) { ajustarPaineisHo(); return desenharFixas(); }
  if (t.classList.contains('ed-hofixo')) return desenharFixas();
  if (t.id === 'au-grupo') return montarMotivos();
  if (t.id === 'ns-tipo') return ajustarNovaSolic();
});

/* Abre já com uma escala publicada, para todas as telas terem conteúdo.
   O fluxo simular → confirmar → publicar continua disponível pelo botão Regerar. */
(function inicial() {
  gravarGeracao(gerarEscala(contexto()), 'Mês completo');
  geracao().status = 'publicada';
  geracao().geradaPor = 'KAMYLA';
  geracao().geradaEm = '05/08/2026 18:22';
  render();
})();
</script>
