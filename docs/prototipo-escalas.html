  });

  html += bloco({
    tit: 'Regeração parcial',
    desc: 'Recalcula apenas o recorte escolhido. Tudo que ficar de fora é congelado exatamente como está na versão vigente.',
    corpo: g ? `<div class="pad" style="display:flex;flex-direction:column;gap:12px">
        <div>
          <span class="rotulo">Equipes (nenhuma marcada = todas)</span>
          <div class="linha-flex">${EQUIPES.map(e =>
            `<label style="display:flex;gap:6px;align-items:center;font-size:12px;border:1px solid var(--line-2);border-radius:6px;padding:4px 8px;cursor:pointer">
              <input type="checkbox" class="eq-parcial" value="${e.id}"> ${esc(e.nome)}</label>`).join('')}</div>
        </div>
        <div class="fim-flex">
          <label><span class="rotulo">De</span><input type="date" id="parcial-de" class="campo" style="width:160px" min="${S.competencia}"></label>
          <label><span class="rotulo">Até</span><input type="date" id="parcial-ate" class="campo" style="width:160px" min="${S.competencia}"></label>
          <button class="btn linha" data-acao="simular-parcial">Regerar apenas o recorte</button>
        </div>
      </div>`
      : `<p class="pad" style="font-size:12.5px;color:var(--muted)">Disponível depois que existir uma versão gravada do mês.</p>`,
  }) + `</div>`;

  if (g) {
    const st = g.status;
    html += bloco({
      tit: `Versão vigente — ${fmComp(S.competencia)}`,
      desc: `Versão ${g.versao} · ${esc(g.escopo)} · gerada em ${esc(g.geradaEm)} por ${esc(g.geradaPor)}.`,
      acoes: `${pilulaStatus(st)}
        <button class="btn linha sm" data-ir="calendario">Revisar no calendário</button>
        ${st !== 'encerrada' ? `<button class="btn sm${st === 'rascunho' ? '' : ' linha'}" data-acao="status" data-alvo="${st === 'rascunho' ? 'publicada' : 'encerrada'}">
          ${st === 'rascunho' ? 'Publicar para a equipe' : 'Encerrar o mês'}</button>` : ''}`,
      corpo: listaAvisos([...g.conflitos, ...g.alertas], 15),
    });
  }

  html += bloco({
    tit: 'Precedência aplicada pelo motor',
    desc: 'A ordem em que cada dia é decidido. As sete primeiras são rígidas e nunca são violadas; as demais são otimizadas no que sobra.',
    corpo: `<ol class="lista">${REGRAS_MOTOR.map(r => `
      <li style="display:flex;gap:12px">
        <span class="num" style="flex-shrink:0;width:24px;height:24px;border-radius:6px;display:grid;place-items:center;font-size:11px;font-weight:700;background:var(--brand-100);color:var(--brand-800)">${r.n}</span>
        <div>
          <div class="linha-flex" style="gap:6px">
            <span style="font-size:12.5px;font-weight:600">${esc(r.t)}</span>
            ${selo(r.rigida ? 'Rígida' : 'Flexível', r.rigida ? 'var(--rose)' : 'var(--muted)', r.rigida ? 'var(--rose-bg)' : 'var(--bg)')}
          </div>
          <p style="font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.5">${esc(r.d)}</p>
        </div>
      </li>`).join('')}</ol>`,
  });

  if (sim) html += painelSimulacao(sim);
  return html;
}

const pilulaStatus = st => ({
  rascunho: pilula('Rascunho', 'var(--amber)', 'var(--amber-bg)'),
  publicada: pilula('Publicada', 'var(--green)', 'var(--green-bg)'),
  encerrada: pilula('Encerrada', 'var(--muted)', 'var(--bg)'),
}[st]);

/** Relatório da simulação — o passo que separa "o que aconteceria" de "o que foi gravado". */
function painelSimulacao(sim) {
  const aderentes = sim.resultado.aderencia.filter(a => a.ok).length;
  return `
  <div class="card" style="position:sticky;bottom:16px;box-shadow:0 8px 28px rgba(15,23,42,.16);border-color:var(--brand-600)">
    <div class="card-topo" style="background:var(--brand-50)">
      <div>
        <h3 class="card-tit">Relatório da simulação — ${esc(sim.escopo)}</h3>
        <p class="card-desc"><b>Nada foi gravado ainda.</b> Confirme para criar a versão ${(geracao()?.versao || 0) + 1} como rascunho, ou descarte e ajuste os planos antes.</p>
      </div>
      <div class="card-acoes">
        <button class="btn fantasma sm" data-acao="descartar-sim">Descartar</button>
        <button class="btn" data-acao="confirmar-sim">Confirmar e gravar</button>
      </div>
    </div>
    <div class="pad grade g3">
      ${kpi('Conflitos bloqueantes', sim.resultado.conflitos.length, 'Ficam sinalizados na escala', 'var(--rose)')}
      ${kpi('Alertas', sim.resultado.alertas.length, 'Desvios tolerados', 'var(--amber)')}
      ${kpi('Planos aderentes', `${aderentes}/${sim.resultado.aderencia.length}`, `Tolerância ±${CONFIG.toleranciaAderencia} dia`, 'var(--green)')}
    </div>
  </div>`;
}

/* ============================================================
   TELA — Indicadores
   ============================================================ */
function telaIndicadores() {
  const g = geracao();
  const [ano, mes] = partesIso(S.competencia);
  const nDias = diasNoMes(ano, mes);
  const meus = new Set(visiveis().map(c => c.id));

  let html = `
    <div class="linha-flex" style="justify-content:space-between">
      <div>
        <h1 style="font-size:17px">Indicadores operacionais</h1>
        <p style="font-size:12px;color:var(--muted);margin-top:2px">${S.papel === 'gestor' ? 'Recorte da sua equipe' : 'Visão consolidada'} · ${fmComp(S.competencia)}</p>
      </div>
      ${seletorMes()}
    </div>`;

  if (!g) {
    return html + bloco({ corpo: vazio(
      `Nenhuma escala gerada para ${fmComp(S.competencia)}`,
      'Os indicadores são calculados sobre a escala do mês. Gere a escala para vê-los aqui.',
      S.papel === 'planejamento' ? `<button class="btn" data-ir="gerar">Ir para a geração</button>` : '') });
  }

  const alocacoes = g.alocacoes.filter(a => meus.has(a.colaboradorId));
  const ocorr = S.ocorrencias.filter(o => meus.has(o.colaboradorId) && o.data.startsWith(S.competencia.slice(0, 7)));
  const solic = S.solicitacoes.filter(s => meus.has(s.colaboradorId));

  const escalados = alocacoes.filter(a => !['DESCANSO', 'FERIADO'].includes(a.modalidade)).length;
  const faltas = ocorr.filter(o => o.tipo === 'FALTA_I' || o.tipo === 'FALTA_J').length;
  const atrasos = ocorr.filter(o => o.tipo === 'ATRASO');
  const minAtraso = atrasos.reduce((a, o) => a + o.minutos, 0);
  const absent = escalados ? (faltas / escalados) * 100 : 0;
  const ader = g.aderencia.filter(a => meus.has(a.colaboradorId));
  const okAder = ader.filter(a => a.ok).length;
  const abertas = solic.filter(s => ['AGUARDA_PARCEIRO', 'TRIAGEM', 'GESTOR', 'FILA'].includes(s.status));

  const uteis = [];
  for (let d = 1; d <= nDias; d++) if (![0, 6].includes(diaSemana(ano, mes, d))) uteis.push(iso(ano, mes, d));

  const media = UNIDADES.map(u => {
    const soma = uteis.reduce((acc, data) => acc + alocacoes.filter(a => a.data === data && a.modalidade === 'UNIDADE' && a.unidadeId === u.id).length, 0);
    const m = uteis.length ? soma / uteis.length : 0;
    const cap = u.capacidadeTotal - u.capacidadeReservadas;
    return { u, m, cap, pct: cap ? (m / cap) * 100 : 0 };
  });

  const rank = [...atrasos.reduce((mp, o) => {
    const at = mp.get(o.colaboradorId) || { nome: colabPorId.get(o.colaboradorId).nome, n: 0, min: 0 };
    mp.set(o.colaboradorId, { nome: at.nome, n: at.n + 1, min: at.min + o.minutos });
    return mp;
  }, new Map()).values()].sort((a, b) => b.min - a.min).slice(0, 6);

  const home = [...alocacoes.filter(a => a.modalidade === 'HOME')
    .reduce((mp, a) => mp.set(a.colaboradorId, (mp.get(a.colaboradorId) || 0) + 1), new Map()).entries()]
    .map(([id, n]) => ({ nome: colabPorId.get(id).nome, n })).sort((a, b) => b.n - a.n).slice(0, 8);

  const porTipo = Object.entries(solic.reduce((m, s) => (m[s.tipo] = (m[s.tipo] || 0) + 1, m), {})).sort((a, b) => b[1] - a[1]);
  const maiorTipo = porTipo.length ? porTipo[0][1] : 1;

  html += `<div class="grade g4">
    ${kpi('Absenteísmo', absent.toFixed(1) + '%', `${faltas} falta(s) em ${escalados} dias escalados`, absent > 3 ? 'var(--rose)' : null)}
    ${kpi('Atrasos', atrasos.length, `${minAtraso} minutos acumulados`, atrasos.length ? 'var(--amber)' : null)}
    ${kpi('Aderência ao plano', ader.length ? Math.round((okAder / ader.length) * 100) + '%' : '—', `${okAder} de ${ader.length} dentro da tolerância ±${CONFIG.toleranciaAderencia}`)}
    ${kpi('Solicitações abertas', abertas.length, `${solic.length} no total do período`)}
  </div>`;

  html += `<div class="grade g2">` + bloco({
    tit: 'Ocupação média por unidade',
    desc: 'Média nos dias úteis do mês, sobre as posições operacionais (total menos reservadas).',
    corpo: `<ul class="lista">${media.map(({ u, m, cap, pct }) => `
      <li>
        <div class="linha-flex" style="justify-content:space-between;font-size:12.5px;margin-bottom:5px">
          <b style="color:${u.cor}">${esc(u.nome)}</b>
          <span class="num" style="color:var(--muted)">${m.toFixed(1)} de ${cap} · ${Math.round(pct)}%</span>
        </div>${barra(m, cap, u.cor)}
      </li>`).join('')}</ul>`,
  });

  html += bloco({
    tit: 'Ranking de atrasos',
    desc: 'Minutos acumulados no mês, por colaborador.',
    corpo: rank.length ? `<ul class="lista">${rank.map(r => `
      <li class="linha-flex" style="justify-content:space-between;font-size:12.5px">
        <b>${esc(r.nome)}</b><span class="num" style="color:var(--amber)">${r.min} min · ${r.n}x</span>
      </li>`).join('')}</ul>`
      : `<p style="padding:28px;text-align:center;font-size:12.5px;color:var(--muted)">Nenhum atraso registrado neste mês.</p>`,
  });

  html += bloco({
    tit: 'Solicitações por tipo',
    desc: 'Volume no período, independentemente do status.',
    corpo: porTipo.length ? `<ul class="lista">${porTipo.map(([t, n]) => `
      <li>
        <div class="linha-flex" style="justify-content:space-between;font-size:12px;margin-bottom:4px">
          <span>${esc(TIPOS_SOLICITACAO[t].label)}</span><b class="num">${n}</b>
        </div>
        <div class="barra"><div style="width:${(n / maiorTipo) * 100}%;background:var(--brand-600)"></div></div>
      </li>`).join('')}</ul>`
      : `<p style="padding:28px;text-align:center;font-size:12.5px;color:var(--muted)">Nenhuma solicitação registrada.</p>`,
  });

  html += bloco({
    tit: 'Home office realizado',
    desc: 'Dias de home office efetivamente escalados no mês.',
    corpo: home.length ? `<ul class="lista">${home.map(h => `
      <li class="linha-flex" style="justify-content:space-between;font-size:12.5px">
        <b>${esc(h.nome)}</b><span class="num" style="color:var(--violet)">${h.n} dia(s)</span>
      </li>`).join('')}</ul>`
      : `<p style="padding:28px;text-align:center;font-size:12.5px;color:var(--muted)">Nenhum dia de home office nesta escala.</p>`,
  }) + `</div>`;

  if (g.conflitos.length || g.alertas.length) {
    html += bloco({
      tit: 'Conflitos e alertas da escala vigente',
      desc: 'Registrados no momento da geração. Bloqueantes exigem decisão manual; avisos são desvios tolerados.',
      corpo: listaAvisos([...g.conflitos, ...g.alertas], 20),
    });
  }

  if (ocorr.length) {
    html += bloco({
      tit: 'Ocorrências do mês',
      desc: 'Lançamentos de ponto e intercorrências registrados pelo Planejamento e pelos gestores.',
      corpo: `<div class="rolagem" style="max-height:340px"><table class="tab">
        <thead><tr><th>Data</th><th>Colaborador</th><th>Tipo</th><th class="dir">Minutos</th><th>Observação</th></tr></thead>
        <tbody>${ocorr.map(o => `<tr>
          <td class="num">${fmData(o.data)}</td>
          <td><b>${esc(colabPorId.get(o.colaboradorId).nome)}</b></td>
          <td style="color:${TIPOS_OCORRENCIA[o.tipo].cor}">${esc(TIPOS_OCORRENCIA[o.tipo].label)}</td>
          <td class="dir num">${o.minutos || '—'}</td>
          <td style="color:var(--muted)">${esc(o.obs) || '—'}</td>
        </tr>`).join('')}</tbody></table></div>`,
    });
  }
  return html;
}
/* ============================================================
   TELA — Calendário (mês + grade + detalhe do dia)
   ============================================================ */
function telaCalendario() {
  const g = geracao();
  const [ano, mes] = partesIso(S.competencia);
  const nDias = diasNoMes(ano, mes);

  let html = `
    <div class="linha-flex" style="justify-content:space-between">
      <div>
        <h1 style="font-size:17px">Calendário da escala</h1>
        <p style="font-size:12px;color:var(--muted);margin-top:2px">${S.papel === 'gestor' ? 'Escala da sua equipe' : 'Escala completa'} · ${fmComp(S.competencia)}</p>
      </div>
      ${seletorMes()}
    </div>`;

  if (!g) {
    return html + bloco({ corpo: vazio(
      `Nenhuma escala gerada para ${fmComp(S.competencia)}`,
      S.papel === 'planejamento'
        ? 'Configure os planos do mês e rode a geração para ver o calendário aqui.'
        : 'Assim que o Planejamento publicar a escala deste mês, ela aparece aqui.',
      S.papel === 'planejamento' ? `<button class="btn" data-ir="gerar">Ir para a geração</button>` : '') });
  }

  // Rascunho não vaza para o colaborador — no sistema real é a policy de RLS.
  if (g.status === 'rascunho' && S.papel === 'colaborador') {
    return html + bloco({ corpo: vazio('A escala deste mês ainda não foi publicada',
      'O Planejamento ainda está revisando. Assim que publicar, seus dias aparecem aqui.') });
  }

  // Recorte por papel (o que a RLS faria no banco) e depois os filtros da tela.
  const f = S.fCal;
  const busca = f.q.trim().toLowerCase();
  const doPapel = visiveis();
  const pessoas = doPapel.filter(c => {
    if (f.equipe && c.equipeId !== Number(f.equipe)) return false;
    if (f.turno && c.turno !== f.turno) return false;
    if (busca && !`${c.nome} ${c.cargo}`.toLowerCase().includes(busca)) return false;
    return true;
  });
  const meus = new Set(pessoas.map(c => c.id));

  const alocacoes = g.alocacoes.filter(a => {
    if (!meus.has(a.colaboradorId)) return false;
    if (!f.modalidade) return true;
    if (f.modalidade.startsWith('U:')) {
      return a.modalidade === 'UNIDADE' && a.unidadeId === Number(f.modalidade.slice(2));
    }
    return a.modalidade === f.modalidade;
  });

  const porDia = new Map();
  for (const a of alocacoes) porDia.set(a.data, [...(porDia.get(a.data) || []), a]);
  const confPorDia = new Map();
  for (const c of g.conflitos) if (c.data) confPorDia.set(c.data, (confPorDia.get(c.data) || 0) + 1);

  const filtroAtivo = !!(f.q || f.equipe || f.turno || f.modalidade);
  const barra = barraFiltros([
    { tipo: 'busca', id: 'fc-q', label: 'Buscar', valor: f.q, dica: 'Nome ou cargo' },
    { tipo: 'sel', id: 'fc-equipe', label: 'Equipe', valor: f.equipe,
      opcoes: [['', 'Todas as equipes'], ...EQUIPES.map(e => [String(e.id), e.nome])] },
    { tipo: 'sel', id: 'fc-turno', label: 'Turno', valor: f.turno,
      opcoes: [['', 'Todos'], ['D', 'Diurno'], ['N', 'Noturno']] },
    { tipo: 'sel', id: 'fc-modalidade', label: 'Modalidade', valor: f.modalidade,
      opcoes: [['', 'Todas'],
        ...UNIDADES.map(u => [`U:${u.id}`, u.nome]),
        ...['HOME', 'EXTERNO', 'FERIAS', 'FOLGA', 'FERIADO'].map(m => [m, MODALIDADES[m].label])] },
  ], filtroAtivo ? `${pessoas.length} de ${doPapel.length} pessoas` : `${doPapel.length} pessoas`);

  html += bloco({
    tit: `Escala de ${fmComp(S.competencia)}`,
    desc: `Versão ${g.versao} · ${esc(g.escopo)} · gerada por ${esc(g.geradaPor)}. ${g.conflitos.length} conflito(s) e ${g.alertas.length} alerta(s).`,
    acoes: `${pilulaStatus(g.status)}
      ${S.papel === 'planejamento' && g.status !== 'encerrada'
        ? `<button class="btn sm${g.status === 'rascunho' ? '' : ' linha'}" data-acao="status" data-alvo="${g.status === 'rascunho' ? 'publicada' : 'encerrada'}">
             ${g.status === 'rascunho' ? 'Publicar para a equipe' : 'Encerrar o mês'}</button>` : ''}`,
    corpo: barra + `
      <div class="pad linha-flex" style="justify-content:flex-end;border-bottom:1px solid var(--line)">
        <div class="abas" role="tablist">
          <button role="tab" aria-selected="${S.vista === 'mes'}" data-vista="mes">Calendário</button>
          <button role="tab" aria-selected="${S.vista === 'grade'}" data-vista="grade">Grade do mês</button>
        </div>
      </div>
      ${pessoas.length === 0
        ? vazio('Nenhuma pessoa nesse filtro', 'Ajuste a busca, a equipe ou o turno para voltar a ver a escala.')
        : S.vista === 'grade'
          ? gradeDoMes(alocacoes, pessoas, ano, mes, nDias, g)
          : calendarioMes(porDia, confPorDia, ano, mes, nDias)}`,
  });

  if (S.dia) html += detalheDia(g, S.dia);
  return html;
}

function calendarioMes(porDia, confPorDia, ano, mes, nDias) {
  let celulas = '';
  for (let i = 0; i < diaSemana(ano, mes, 1); i++) celulas += '<div></div>';
  for (let d = 1; d <= nDias; d++) {
    const data = iso(ano, mes, d);
    const dow = diaSemana(ano, mes, d);
    const fds = dow === 0 || dow === 6;
    const feriado = FERIADOS[data];
    const nConf = confPorDia.get(data) || 0;

    const cont = new Map();
    for (const a of porDia.get(data) || []) {
      if (a.modalidade === 'DESCANSO') continue;
      const chave = a.modalidade === 'UNIDADE' ? 'U' + a.unidadeId : a.modalidade;
      const ap = apar(a.modalidade, a.unidadeId);
      cont.set(chave, { ...ap, n: (cont.get(chave)?.n || 0) + 1 });
    }
    const linhas = [...cont.values()].sort((a, b) => b.n - a.n).slice(0, 4);

    celulas += `
      <button class="dia" data-dia="${data}" data-fds="${fds || feriado ? 1 : 0}" aria-pressed="${S.dia === data}">
        <div style="display:flex;justify-content:space-between;gap:4px">
          <span class="dia-num">${d}</span>
          ${nConf ? `<span class="selo num" style="color:var(--rose);background:var(--rose-bg)">${nConf}</span>` : ''}
        </div>
        ${feriado ? `<span style="font-size:9px;color:var(--amber);line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(feriado)}</span>` : ''}
        <div style="margin-top:auto;display:flex;flex-direction:column;gap:2px">
          ${linhas.map(l => `<span class="dia-lin" style="background:${l.bg};color:${l.cor}"><span>${esc(l.sigla)}</span><span class="num">${l.n}</span></span>`).join('')}
        </div>
      </button>`;
  }
  return `<div class="pad">
    <div class="cal" style="margin-bottom:6px">${DIAS_ABREV.map(d => `<div class="cal-cab">${d}</div>`).join('')}</div>
    <div class="cal">${celulas}</div>
    <p style="font-size:11px;color:var(--muted);margin-top:12px">Clique num dia para abrir a lista de quem está onde, travar alocações e lançar ocorrências.</p>
  </div>`;
}

function gradeDoMes(alocacoes, listaPessoas, ano, mes, nDias, g) {
  const dias = Array.from({ length: nDias }, (_, i) => i + 1);
  const pessoas = listaPessoas.filter(c => c.status === 'ativo')
    .sort((a, b) => equipePorId.get(a.equipeId).nome.localeCompare(equipePorId.get(b.equipeId).nome) || a.nome.localeCompare(b.nome));
  const porChave = new Map(alocacoes.map(a => [`${a.colaboradorId}|${a.data}`, a]));

  let corpo = '', equipeAtual = null;
  for (const c of pessoas) {
    if (equipeAtual !== c.equipeId) {
      equipeAtual = c.equipeId;
      const eq = equipePorId.get(c.equipeId);
      corpo += `<tr class="faixa-eq"><td colspan="${1 + nDias + 3}">${esc(eq.nome)} · ${eq.regime} · turno ${eq.turno === 'N' ? 'noturno' : 'diurno'}</td></tr>`;
    }
    const t = { 1: 0, 2: 0, HOME: 0 };
    const cels = dias.map(d => {
      const a = porChave.get(`${c.id}|${iso(ano, mes, d)}`);
      if (!a || a.modalidade === 'DESCANSO') return `<td style="text-align:center;color:var(--faint);background:var(--bg)">·</td>`;
      if (a.modalidade === 'UNIDADE') t[a.unidadeId]++;
      else if (a.modalidade === 'HOME') t.HOME++;
      const ap = apar(a.modalidade, a.unidadeId);
      return `<td><button class="cel" data-dia="${iso(ano, mes, d)}" style="background:${ap.bg};color:${ap.cor};border:0;width:100%;cursor:pointer"
        title="${esc(c.nome)} · ${fmData(iso(ano, mes, d))} · ${esc(ap.label)}${a.travado ? ' (travado)' : ''}">${esc(ap.sigla)}${a.travado ? '<span class="pin">▪</span>' : ''}</button></td>`;
    }).join('');

    corpo += `<tr>
      <td class="trava"><b>${esc(c.nome)}</b><div style="font-size:10.5px;color:var(--muted)">${esc(c.cargo)} · ${c.entrada}</div></td>
      ${cels}
      <td style="text-align:center;font-weight:600;color:${UNIDADES[0].cor}" class="num">${t[1]}</td>
      <td style="text-align:center;font-weight:600;color:${UNIDADES[1].cor}" class="num">${t[2]}</td>
      <td style="text-align:center;font-weight:600;color:var(--violet)" class="num">${t.HOME}</td>
    </tr>`;
  }

  const rodape = UNIDADES.map(u => `<tr>
    <td class="trava" style="background:var(--surface-2);font-size:11px;font-weight:600">Ocupação ${esc(u.nome)}</td>
    ${dias.map(d => {
      const data = iso(ano, mes, d);
      const n = alocacoes.filter(a => a.data === data && a.modalidade === 'UNIDADE' && a.unidadeId === u.id).length;
      const cap = (g.capacidadeDia[data] || {})[u.id] || 0;
      const cheio = cap > 0 && n >= cap;
      return `<td class="num" style="text-align:center;font-size:10px;font-weight:700;background:${cheio ? 'var(--rose-bg)' : 'var(--surface-2)'};color:${cheio ? 'var(--rose)' : 'var(--muted)'}" title="${n} de ${cap} posições">${n}</td>`;
    }).join('')}
    <td colspan="3" style="background:var(--surface-2)"></td>
  </tr>`).join('');

  return `
    <div class="pad" style="display:flex;justify-content:flex-end;border-bottom:1px solid var(--line)">
      <button class="btn linha sm" data-acao="csv-grade">Exportar grade em CSV</button>
    </div>
    <div class="planilha"><table style="min-width:${360 + nDias * 30 + 140}px">
      <thead><tr>
        <th class="trava">Colaborador</th>
        ${dias.map(d => {
          const dow = diaSemana(ano, mes, d);
          const esp = [0, 6].includes(dow) || FERIADOS[iso(ano, mes, d)];
          return `<th style="min-width:30px;text-align:center;padding:6px 2px;background:${esp ? 'var(--bg)' : 'var(--surface-2)'}">
            <div style="color:var(--faint)">${DIAS_INICIAL[dow]}</div><div class="num" style="color:var(--text)">${d}</div></th>`;
        }).join('')}
        ${UNIDADES.map(u => `<th style="text-align:center">${u.sigla}</th>`).join('')}
        <th style="text-align:center">HO</th>
      </tr></thead>
      <tbody>${corpo}</tbody>
      <tfoot>${rodape}</tfoot>
    </table></div>
    <div class="legenda">
      ${UNIDADES.map(u => selo(`${u.sigla} · ${u.nome}`, u.cor, u.bg)).join('')}
      ${selo('HO · Home Office', '#6D28D9', '#EDE9FE')}
      ${selo('FÉR · Férias', '#B45309', '#FEF3C7')}
      ${selo('AUS · Ausência', '#526176', '#F1F5F9')}
      <span style="font-size:10.5px;color:var(--muted);align-self:center">▪ marca alocação travada</span>
    </div>`;
}

function detalheDia(g, data) {
  const dow = dowDeIso(data);
  const meus = new Set(visiveis().map(c => c.id));
  const doDia = g.alocacoes.filter(a => a.data === data && meus.has(a.colaboradorId) && a.modalidade !== 'DESCANSO')
    .map(a => ({ a, c: colabPorId.get(a.colaboradorId) }))
    .sort((x, y) => x.c.nome.localeCompare(y.c.nome));

  const ocorr = S.ocorrencias.filter(o => o.data === data);
  const podeEditar = S.papel === 'planejamento' && g.status !== 'encerrada';
  const contar = f => g.alocacoes.filter(a => a.data === data && meus.has(a.colaboradorId) && f(a)).length;
  const faixa = c => {
    const h = c.sextaReduzida && dow === 5 ? c.jornada - 1 : c.jornada;
    return `${c.entrada}–${somaHoras(c.entrada, h + (h > 6 ? 1 : 0))}`;
  };

  const cards = UNIDADES.map(u => {
    const n = contar(a => a.modalidade === 'UNIDADE' && a.unidadeId === u.id);
    const cap = (g.capacidadeDia[data] || {})[u.id] || 0;
    return `<div style="border:1px solid var(--line);border-radius:8px;padding:8px 12px">
      <span class="rotulo" style="color:${u.cor}">${esc(u.nome)}</span>
      <div style="font-size:20px;font-weight:600" class="num">${n}<span style="font-size:12px;color:var(--muted);font-weight:500"> / ${cap}</span></div>
      <div style="margin-top:6px">${barra(n, cap, u.cor)}</div>
    </div>`;
  }).join('');

  return bloco({
    tit: `${DIAS_ABREV[dow]}, ${fmData(data)}${FERIADOS[data] ? ' · ' + esc(FERIADOS[data]) : ''}`,
    desc: `${doDia.length} pessoa(s) em atividade neste dia.`,
    acoes: `<button class="btn fantasma sm" data-acao="fechar-dia">Fechar</button>`,
    corpo: `
      <div class="pad grade g4" style="border-bottom:1px solid var(--line)">
        ${cards}
        <div style="border:1px solid var(--line);border-radius:8px;padding:8px 12px">
          <span class="rotulo" style="color:var(--violet)">Home Office</span>
          <div style="font-size:20px;font-weight:600" class="num">${contar(a => a.modalidade === 'HOME')}</div>
        </div>
        <div style="border:1px solid var(--line);border-radius:8px;padding:8px 12px">
          <span class="rotulo">Ausentes</span>
          <div style="font-size:20px;font-weight:600" class="num">${contar(a => ['FERIAS','FOLGA','AFAST','FERIADO'].includes(a.modalidade))}</div>
        </div>
      </div>
      <div class="rolagem" style="max-height:420px"><table class="tab">
        <thead><tr><th>Colaborador</th><th>Equipe · Cargo</th><th>Alocação</th><th>Horário</th>${podeEditar ? '<th class="dir">Ações</th>' : ''}</tr></thead>
        <tbody>
        ${doDia.length ? doDia.map(({ a, c }) => {
          const ap = apar(a.modalidade, a.unidadeId);
          const ocs = ocorr.filter(o => o.colaboradorId === c.id);
          return `<tr>
            <td>
              <div class="linha-flex" style="gap:6px"><b>${esc(c.nome)}</b>
                ${a.travado ? selo('travado', 'var(--brand-700)', 'var(--brand-100)') : ''}
                ${ocs.map(o => selo(TIPOS_OCORRENCIA[o.tipo].label + (o.minutos ? ` ${o.minutos}min` : ''), TIPOS_OCORRENCIA[o.tipo].cor, 'var(--bg)')).join('')}
              </div>
              <div style="font-size:10.5px;color:var(--muted)" class="num">${esc(c.matricula)}</div>
            </td>
            <td style="color:var(--muted)">${esc(equipePorId.get(c.equipeId).nome)}<div style="font-size:10.5px">${esc(c.cargo)}</div></td>
            <td>${podeEditar ? `
              <div class="linha-flex" style="gap:6px">
                <select class="campo" style="width:150px;padding:4px 8px" data-mover="${c.id}">
                  ${UNIDADES.map(u => `<option value="UNIDADE:${u.id}"${a.modalidade === 'UNIDADE' && a.unidadeId === u.id ? ' selected' : ''}>${esc(u.nome)}</option>`).join('')}
                  ${['HOME','EXTERNO','EVENTO','TREINA','FOLGA','AFAST'].map(m => `<option value="${m}"${a.modalidade === m ? ' selected' : ''}>${esc(MODALIDADES[m].label)}</option>`).join('')}
                </select>
                <button class="btn linha sm" data-acao="mover" data-colab="${c.id}">Mover</button>
              </div>` : selo(ap.label, ap.cor, ap.bg)}</td>
            <td class="num" style="color:var(--muted)">${['FERIAS','FOLGA','AFAST','FERIADO'].includes(a.modalidade) ? '—' : faixa(c)}</td>
            ${podeEditar ? `<td class="dir"><button class="btn fantasma sm" data-acao="travar" data-colab="${c.id}">${a.travado ? 'Liberar' : 'Travar'}</button></td>` : ''}
          </tr>`;
        }).join('') : `<tr><td colspan="5" style="text-align:center;padding:28px;color:var(--muted)">Ninguém escalado neste dia.</td></tr>`}
        </tbody>
      </table></div>
      ${S.papel !== 'colaborador' && doDia.length ? `
      <div class="pad fim-flex" style="border-top:1px solid var(--line)">
        <label><span class="rotulo">Lançar ocorrência</span>
          <select id="oc-colab" class="campo" style="width:200px">${doDia.map(({ c }) => `<option value="${c.id}">${esc(c.nome)}</option>`).join('')}</select></label>
        <label><span class="rotulo">Tipo</span>
          <select id="oc-tipo" class="campo" style="width:180px">${Object.entries(TIPOS_OCORRENCIA).map(([k, v]) => `<option value="${k}">${esc(v.label)}</option>`).join('')}</select></label>
        <label><span class="rotulo">Minutos</span><input id="oc-min" type="number" min="0" value="0" class="campo num" style="width:90px"></label>
        <label style="flex:1;min-width:180px"><span class="rotulo">Observação</span><input id="oc-obs" class="campo" placeholder="Contexto do lançamento"></label>
        <button class="btn sm" data-acao="ocorrencia">Registrar</button>
      </div>` : ''}`,
  });
}

/* ============================================================
   TELA — Ocupação
   ============================================================ */
function telaOcupacao() {
  const g = geracao();
  const [ano, mes] = partesIso(S.competencia);
  const nDias = diasNoMes(ano, mes);

  let html = `
    <div class="linha-flex" style="justify-content:space-between">
      <div>
        <h1 style="font-size:17px">Painel de ocupação</h1>
        <p style="font-size:12px;color:var(--muted);margin-top:2px">Quantas posições cada unidade tem ocupadas, dia a dia — ${fmComp(S.competencia)}</p>
      </div>
      ${seletorMes()}
    </div>`;

  if (!g) return html + bloco({ corpo: vazio(`Sem escala gerada em ${fmComp(S.competencia)}`, 'A ocupação por unidade é calculada a partir da escala do mês.') });

  const meus = new Set(visiveis().map(c => c.id));
  const alocacoes = g.alocacoes.filter(a => meus.has(a.colaboradorId));
  const sel = S.dia && S.dia.startsWith(S.competencia.slice(0, 7)) ? S.dia : iso(ano, mes, 1);

  let tiras = '';
  for (let d = 1; d <= nDias; d++) {
    const data = iso(ano, mes, d);
    const dow = diaSemana(ano, mes, d);
    const total = alocacoes.filter(a => a.data === data && a.modalidade === 'UNIDADE').length;
    const barras = UNIDADES.map(u => {
      const n = alocacoes.filter(a => a.data === data && a.modalidade === 'UNIDADE' && a.unidadeId === u.id).length;
      const cap = (g.capacidadeDia[data] || {})[u.id] || 0;
      const h = cap > 0 ? Math.max(2, Math.round((n / cap) * 28)) : 2;
      return `<span style="width:8px;border-radius:2px;height:${h}px;background:${cap && n >= cap ? 'var(--rose)' : u.cor}"></span>`;
    }).join('');
    tiras += `<button class="dia" data-dia="${data}" style="width:46px;min-height:0;flex-shrink:0;align-items:center;text-align:center" aria-pressed="${sel === data}">
      <div style="font-size:9px;color:var(--faint);text-transform:uppercase">${DIAS_ABREV[dow]}</div>
      <div class="dia-num">${d}</div>
      <div style="display:flex;align-items:flex-end;justify-content:center;gap:2px;height:28px;margin-top:2px">${barras}</div>
      <div class="num" style="font-size:9.5px;color:var(--muted)">${total}</div>
    </button>`;
  }

  html += bloco({
    tit: 'Ocupação por dia',
    desc: 'Barras proporcionais às posições operacionais. Clique num dia para ver quem está onde.',
    acoes: `<button class="btn linha sm" data-acao="csv-ocupacao">Exportar mês em CSV</button>`,
    corpo: `<div class="pad rolagem"><div style="display:flex;gap:4px;width:max-content">${tiras}</div></div>`,
  });

  html += `<div class="grade g2">`;
  for (const u of UNIDADES) {
    const cap = (g.capacidadeDia[sel] || {})[u.id] || 0;
    const pessoas = alocacoes.filter(a => a.data === sel && a.modalidade === 'UNIDADE' && a.unidadeId === u.id)
      .map(a => colabPorId.get(a.colaboradorId)).sort((a, b) => a.nome.localeCompare(b.nome));
    html += bloco({
      tit: u.nome,
      desc: `${pessoas.length} de ${cap} posições ocupadas em ${fmData(sel)} · ${u.capacidadeReservadas} reservada(s)`,
      acoes: pessoas.length >= cap && cap ? selo('Lotado', 'var(--rose)', 'var(--rose-bg)') : '',
      corpo: `<div style="padding:4px 16px 10px">${barra(pessoas.length, cap, u.cor)}</div>
        ${pessoas.length ? `<ul class="lista" style="max-height:300px;overflow:auto">${pessoas.map(c => `
          <li class="linha-flex" style="justify-content:space-between;font-size:12.5px">
            <div><b>${esc(c.nome)}</b><div style="font-size:10.5px;color:var(--muted)">${esc(c.cargo)} · ${esc(equipePorId.get(c.equipeId).nome)}</div></div>
            <span class="num" style="color:var(--muted)">${c.entrada} · ${c.turno === 'N' ? 'Not.' : 'Diu.'}</span>
          </li>`).join('')}</ul>`
          : `<p style="padding:0 16px 16px;font-size:12px;color:var(--muted)">Ninguém alocado nesta unidade no dia selecionado.</p>`}`,
    });
  }

  const remoto = ['HOME','EXTERNO','EVENTO','TREINA','FERIAS','FOLGA','AFAST','FERIADO']
    .map(m => ({ m, n: alocacoes.filter(a => a.data === sel && a.modalidade === m).length })).filter(x => x.n);
  html += bloco({
    tit: 'Remoto e ausências',
    desc: `Distribuição fora das unidades físicas em ${fmData(sel)}.`,
    corpo: remoto.length ? `<ul class="lista">${remoto.map(({ m, n }) => `
      <li class="linha-flex" style="justify-content:space-between;font-size:12.5px">
        ${selo(MODALIDADES[m].label, MODALIDADES[m].cor, MODALIDADES[m].bg)}<b class="num">${n}</b>
      </li>`).join('')}</ul>` : `<p style="padding:16px;font-size:12px;color:var(--muted)">Ninguém fora das unidades neste dia.</p>`,
  }) + `</div>`;
  return html;
}
/* ============================================================
   TELA — Planos do mês
   ============================================================ */
function telaPlanos() {
  const pend = pendencias();
  const pendPor = new Map();
  for (const p of pend) pendPor.set(p.colaboradorId, [...(pendPor.get(p.colaboradorId) || []), p.msg]);

  const planos = planosDoMes();
  const planoPor = new Map(planos.map(p => [p.colaboradorId, p]));
  const ausPor = new Map();
  for (const a of S.ausencias) ausPor.set(a.colaboradorId, [...(ausPor.get(a.colaboradorId) || []), a]);
  const ativos = COLABORADORES.filter(c => c.status === 'ativo');

  let html = `
    <div class="linha-flex" style="justify-content:space-between">
      <div>
        <h1 style="font-size:17px">Planos do mês</h1>
        <p style="font-size:12px;color:var(--muted);margin-top:2px">Distribuição por unidade, home office, ciclo 12x36 e ausências — ${fmComp(S.competencia)}</p>
      </div>
      ${seletorMes()}
    </div>
    <div class="grade g3">
      ${kpi('Planos configurados', `${planos.length}/${ativos.length}`, 'Colaboradores ativos')}
      ${kpi('Pendências', pend.length, pend.length ? 'Bloqueiam a geração do mês' : 'Nenhuma — pode gerar', pend.length ? 'var(--rose)' : null)}
      ${kpi('Ausências no mês', S.ausencias.length, 'Inclui férias e períodos em curso')}
    </div>`;

  if (S.colabAberto) html += editorPlano(S.colabAberto, planoPor.get(S.colabAberto), ausPor.get(S.colabAberto) || [], pendPor.get(S.colabAberto) || []);

  const f = S.fPlanos;
  const busca = f.q.trim().toLowerCase();
  const listados = ativos.filter(c => {
    if (f.equipe && c.equipeId !== Number(f.equipe)) return false;
    if (f.pendentes && !pendPor.has(c.id)) return false;
    if (busca && !`${c.nome} ${c.cargo} ${c.matricula}`.toLowerCase().includes(busca)) return false;
    return true;
  });

  html += bloco({
    tit: 'Colaboradores',
    desc: 'Cada linha resume o que o motor vai usar neste mês. Sem plano, o colaborador cai 100% na unidade base.',
    corpo: barraFiltros([
      { tipo: 'busca', id: 'fp-q', label: 'Buscar', valor: f.q, dica: 'Nome, cargo ou matrícula' },
      { tipo: 'sel', id: 'fp-equipe', label: 'Equipe', valor: f.equipe,
        opcoes: [['', 'Todas as equipes'], ...EQUIPES.map(e => [String(e.id), e.nome])] },
      { tipo: 'marca', id: 'fp-pendentes', label: 'Só com pendência', valor: f.pendentes },
    ], `${listados.length} de ${ativos.length}`) +
    (listados.length === 0
      ? vazio('Nenhum colaborador nesse filtro', 'Ajuste a busca, a equipe ou desmarque "só com pendência".')
      : `<div class="rolagem" style="max-height:520px"><table class="tab">
      <thead><tr><th>Colaborador</th><th>Equipe · Regime</th><th>Ciclo</th><th>Distribuição</th><th>Unidades fixas</th><th>Home office</th><th>Férias e ausências</th><th></th></tr></thead>
      <tbody>${listados.map(c => {
        const p = planoPor.get(c.id);
        const pd = pendPor.get(c.id) || [];
        const aus = ausPor.get(c.id) || [];
        const ho = p && p.homeOffice;
        return `<tr>
          <td>
            <b>${esc(c.nome)}</b>
            <div style="font-size:10.5px;color:var(--muted)">${esc(c.cargo)} · entrada ${c.entrada}</div>
            ${pd.length ? `<div style="font-size:10.5px;color:var(--rose);margin-top:3px;line-height:1.4">${esc(pd[0])}${pd.length > 1 ? ` (+${pd.length - 1})` : ''}</div>` : ''}
          </td>
          <td style="color:var(--muted)">${esc(equipePorId.get(c.equipeId).nome)}<div style="font-size:10.5px">${c.regime} · ${c.turno === 'N' ? 'noturno' : 'diurno'}</div></td>
          <td>${c.regime !== '12x36' ? '<span style="color:var(--faint)">—</span>'
            : p && p.ciclo ? selo(p.ciclo === 'IMPAR' ? 'Ímpares' : 'Pares', 'var(--brand-700)', 'var(--brand-100)')
            : selo('Definir', 'var(--rose)', 'var(--rose-bg)')}</td>
          <td>${p ? `<div class="linha-flex" style="gap:4px">${UNIDADES.filter(u => (p.distribuicao[u.id] || 0) > 0)
            .map(u => selo(`${u.sigla} ${p.distribuicao[u.id]}%`, u.cor, u.bg)).join('')}</div>`
            : selo('Sem plano', 'var(--amber)', 'var(--amber-bg)')}</td>
          <td>${p && Object.keys(p.unidadesFixas || {}).length
            ? `<div class="linha-flex" style="gap:4px">${Object.entries(p.unidadesFixas)
                .sort((a, b) => a[0] - b[0])
                .map(([dw, un]) => { const u = unidadePorId.get(Number(un));
                  return selo(`${DIAS_ABREV[dw]} ${u.sigla}`, u.cor, u.bg); }).join('')}</div>`
            : '<span style="color:var(--faint)">—</span>'}</td>
          <td style="color:var(--muted)">${!c.elegHome ? '<span style="color:var(--faint)">Não elegível</span>'
            : ho && ho.modo === 'FIXO' ? `Fixo · ${ho.diasSemana.map(d => DIAS_ABREV[d]).join(', ')}`
            : ho && ho.modo === 'COTA' ? `Cota · ${ho.quantidade}x/semana`
            : '<span style="color:var(--faint)">Sem home office</span>'}</td>
          <td style="color:var(--muted);font-size:10.5px">${aus.length ? aus.slice(0, 2).map(a =>
            `<div>${a.tipo === 'FERIAS' ? 'Férias' : esc(a.grupo + ' — ' + a.motivo)}: ${fmData(a.inicio)} a ${fmData(fimAusencia(a.inicio, a.dias))}</div>`).join('')
            + (aus.length > 2 ? `<div>+${aus.length - 2}</div>` : '') : '<span style="color:var(--faint)">—</span>'}</td>
          <td class="dir"><button class="btn linha sm" data-plano="${c.id}">${p ? 'Editar' : 'Configurar'}</button></td>
        </tr>`;
      }).join('')}</tbody></table></div>`),
  });
  return html;
}

const DEGRAUS = [0, 25, 50, 75, 100];
const UTEIS = [1, 2, 3, 4, 5];

function editorPlano(colabId, plano, ausencias, pends) {
  const c = colabPorId.get(colabId);
  const ho = (plano && plano.homeOffice) || { modo: null, diasSemana: [], quantidade: 2, diasPreferencia: [], diasProibidos: [] };
  const dist = (plano && plano.distribuicao) || { [c.unidadeBaseId]: 100 };

  return bloco({
    tit: `Plano de ${esc(c.nome)} — ${fmComp(S.competencia)}`,
    desc: `${esc(c.cargo)} · ${c.regime} · turno ${c.turno === 'N' ? 'noturno' : 'diurno'} · entrada ${c.entrada} · unidade base ${esc(unidadePorId.get(c.unidadeBaseId).nome)}`,
    acoes: `<button class="btn fantasma sm" data-acao="fechar-plano">Fechar</button>`,
    corpo: `
      ${pends.length ? `<ul class="lista" style="background:var(--rose-bg)">${pends.map(p =>
        `<li style="font-size:11.5px;font-weight:600;color:var(--rose);border-color:rgba(190,18,60,.15)">${esc(p)}</li>`).join('')}</ul>` : ''}
      <div class="pad" style="display:flex;flex-direction:column;gap:20px">
        ${c.regime === '12x36' ? `
        <section>
          <span class="rotulo">Ciclo do mês (12x36)</span>
          <div class="linha-flex">
            ${['IMPAR', 'PAR'].map(v => `<label style="display:flex;gap:8px;align-items:center;border:1px solid var(--line-2);border-radius:6px;padding:7px 12px;font-size:12.5px;cursor:pointer">
              <input type="radio" name="ciclo" value="${v}" class="ed-ciclo"${(plano && plano.ciclo) === v ? ' checked' : ''}> Dias ${v === 'IMPAR' ? 'ímpares' : 'pares'}
              ${c.ciclo === v ? '<span style="font-size:10.5px;color:var(--muted)">(base do cadastro)</span>' : ''}</label>`).join('')}
          </div>
          <p style="font-size:11px;color:var(--muted);margin-top:6px">Meses de 31 dias invertem a paridade no mês seguinte para preservar o descanso de 36h. O motor já sugere o ciclo correto a partir do mês âncora; aqui você pode sobrepor.</p>
        </section>` : ''}

        <section>
          <div class="linha-flex" style="justify-content:space-between;margin-bottom:6px">
            <span class="rotulo" style="margin:0">Distribuição dos dias presenciais</span>
            <b id="soma-dist" class="num" style="font-size:11.5px"></b>
          </div>
          ${UNIDADES.map(u => `<div class="linha-flex" style="margin-bottom:8px">
            <span style="width:110px;font-size:12.5px;font-weight:500;color:${u.cor}">${esc(u.nome)}</span>
            <div class="linha-flex" style="gap:4px">${DEGRAUS.map(d =>
              `<button type="button" class="deg num" data-un="${u.id}" data-pct="${d}"
                style="padding:4px 10px;border-radius:6px;font-size:11.5px;font-weight:700;cursor:pointer;border:1px solid ${(dist[u.id] || 0) === d ? u.cor : 'var(--line-2)'};background:${(dist[u.id] || 0) === d ? u.cor : 'var(--surface)'};color:${(dist[u.id] || 0) === d ? '#fff' : 'var(--muted)'}">${d}%</button>`).join('')}</div>
          </div>`).join('')}
          <p style="font-size:11px;color:var(--muted)">Só degraus de 25% — em dias inteiros, 33% não significa nada e vira desvio de aderência que ninguém consegue explicar depois. Com duas unidades, escolher uma já define a outra.</p>
        </section>

        <section>
          <span class="rotulo">Unidade fixa por dia da semana</span>
          <p class="ajuda" style="margin-bottom:10px">
            Trave um dia da semana numa unidade — por exemplo, toda terça e quarta no Morumbi.
            Esses dias saem da distribuição percentual acima: já estão decididos e ocupam posição na unidade.
          </p>
          <div class="fixas" id="fixas"></div>
          <div id="fixas-resumo"></div>
        </section>

        <section>
          <span class="rotulo">Home office</span>
          ${!c.elegHome ? `<p style="font-size:12px;color:var(--muted)">${esc(c.nome)} não está marcado como elegível a home office no cadastro. Ajuste em Colaboradores para liberar esta seção.</p>` : `
          <div class="linha-flex" style="margin-bottom:10px">
            ${[['', 'Sem home office'], ['FIXO', 'Dias fixos'], ['COTA', 'Cota semanal']].map(([v, l]) =>
              `<label style="display:flex;gap:8px;align-items:center;border:1px solid var(--line-2);border-radius:6px;padding:7px 12px;font-size:12.5px;cursor:pointer">
                <input type="radio" name="homodo" value="${v}" class="ed-homodo"${(ho.modo || '') === v ? ' checked' : ''}> ${l}</label>`).join('')}
          </div>

          <div id="ho-fixo" style="border:1px solid var(--line);border-radius:8px;padding:12px">
            <span class="rotulo">Dias em home office</span>
            <div class="linha-flex" style="gap:6px">${UTEIS.map(d =>
              `<label style="display:flex;gap:5px;align-items:center;font-size:12px;border:1px solid var(--line-2);border-radius:5px;padding:4px 8px;cursor:pointer">
                <input type="checkbox" class="ed-hofixo" value="${d}"${ho.diasSemana.includes(d) ? ' checked' : ''}> ${DIAS_ABREV[d]}</label>`).join('')}</div>
            <p class="ajuda">Todo mês, nesses dias da semana. Um dia não pode ser home office fixo e unidade fixa ao mesmo tempo.</p>
          </div>

          <div id="ho-cota" style="border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:12px">
            <label><span class="rotulo">Dias por semana</span>
              <input type="number" min="1" max="5" value="${ho.quantidade || 2}" class="campo num ed-hoqtd" style="width:90px"></label>
            <div><span class="rotulo">Dias de preferência</span>
              <div class="linha-flex" style="gap:6px">${UTEIS.map(d =>
                `<label style="display:flex;gap:5px;align-items:center;font-size:12px;border:1px solid var(--line-2);border-radius:5px;padding:4px 8px;cursor:pointer">
                  <input type="checkbox" class="ed-hopref" value="${d}"${ho.diasPreferencia.includes(d) ? ' checked' : ''}> ${DIAS_ABREV[d]}</label>`).join('')}</div></div>
            <div><span class="rotulo">Dias proibidos</span>
              <div class="linha-flex" style="gap:6px">${UTEIS.map(d =>
                `<label style="display:flex;gap:5px;align-items:center;font-size:12px;border:1px solid var(--line-2);border-radius:5px;padding:4px 8px;cursor:pointer">
                  <input type="checkbox" class="ed-hoproib" value="${d}"${ho.diasProibidos.includes(d) ? ' checked' : ''}> ${DIAS_ABREV[d]}</label>`).join('')}</div></div>
            <p class="ajuda">A quantidade é rígida e o dia é flexível: o motor tenta os dias de preferência primeiro e nunca usa os proibidos.</p>
          </div>`}
        </section>

        <section>
          <span class="rotulo">Férias e ausências</span>
          ${ausencias.length ? `<ul class="lista" style="border:1px solid var(--line);border-radius:8px;margin-bottom:10px">${ausencias.map(a => `
            <li class="linha-flex" style="justify-content:space-between;font-size:12.5px">
              <span>${a.tipo === 'FERIAS' ? '<b>Férias</b>' : `<b>${esc(a.grupo)}</b> — ${esc(a.motivo)}`} ·
                ${fmData(a.inicio)} a ${fmData(fimAusencia(a.inicio, a.dias))}
                <span style="color:var(--muted)">(${a.dias} dia(s))</span></span>
              <button class="btn fantasma sm" data-acao="rm-ausencia" data-id="${a.id}">Remover</button>
            </li>`).join('')}</ul>` : ''}
          <div class="fim-flex">
            <label style="flex:0 1 130px"><span class="rotulo">Tipo</span>
              <select id="au-tipo" class="campo"><option value="AUSENCIA">Ausência</option><option value="FERIAS">Férias</option></select></label>
            <label style="flex:0 1 155px">
              <span class="rotulo">Início <span style="color:var(--rose)">*</span></span>
              <input type="date" id="au-inicio" class="campo" required></label>
            <label style="flex:0 1 110px"><span class="rotulo">Dias corridos</span><input type="number" id="au-dias" min="1" max="365" value="1" class="campo num"></label>
            <label style="flex:0 1 130px"><span class="rotulo">Grupo</span>
              <select id="au-grupo" class="campo">${GRUPOS_AUSENCIA.map(g => `<option>${esc(g.grupo)}</option>`).join('')}</select></label>
            <label style="flex:1 1 190px"><span class="rotulo">Motivo</span><select id="au-motivo" class="campo"></select></label>
            <button class="btn linha sm" data-acao="add-ausencia">Adicionar</button>
          </div>
          ${recadoLocal('ausencia')}
          <p style="font-size:11px;color:var(--muted);margin-top:6px">A ausência fica ligada à pessoa, não ao mês: um período que começa em um mês e termina no seguinte bloqueia os dois. Períodos sobrepostos são recusados.</p>
        </section>

        ${recadoLocal('plano')}
        <div class="linha-flex">
          <button class="btn" data-acao="salvar-plano" data-colab="${colabId}">Salvar plano</button>
          <span style="font-size:11.5px;color:var(--muted)">Salvar o plano não altera a escala já gerada — é preciso gerar de novo.</span>
        </div>
      </div>`,
  });
}

/* ============================================================
   TELA — Solicitações
   ============================================================ */
const ABERTOS = ['AGUARDA_PARCEIRO', 'TRIAGEM', 'GESTOR', 'FILA'];

function telaSolicitacoes() {
  const eu = euSou();
  const meus = new Set(visiveis().map(c => c.id));
  const lista = S.solicitacoes.filter(s =>
    S.papel === 'colaborador' ? (s.colaboradorId === eu?.id || s.parceiroId === eu?.id) : meus.has(s.colaboradorId));

  const abertas = lista.filter(s => ABERTOS.includes(s.status) && s.status !== 'FILA');
  const fila = lista.filter(s => s.status === 'FILA').sort((a, b) => (a.posicaoFila || 99) - (b.posicaoFila || 99));
  const hist = lista.filter(s => ['APROVADA', 'RECUSADA'].includes(s.status));
  const atual = S.aba === 'fila' ? fila : S.aba === 'historico' ? hist : abertas;

  const tit = S.papel === 'planejamento' ? 'Solicitações' : S.papel === 'gestor' ? 'Aprovações da equipe' : 'Minhas solicitações';
  const sub = S.papel === 'planejamento' ? 'Triagem, encaminhamento ao gestor e lista de espera.'
    : S.papel === 'gestor' ? 'Pedidos da sua equipe que chegaram para decisão.'
    : 'Seus pedidos e as trocas em que você foi convidado.';

  let html = `
    <div class="linha-flex" style="justify-content:space-between">
      <div><h1 style="font-size:17px">${tit}</h1>
        <p style="font-size:12px;color:var(--muted);margin-top:2px">${sub}</p></div>
      ${S.papel === 'colaborador' ? `<button class="btn sm" data-ir="minha-escala">Abrir nova solicitação</button>` : ''}
    </div>
    <div class="abas" role="tablist">
      ${[['abertas', 'Abertas', abertas.length], ['fila', 'Lista de espera', fila.length], ['historico', 'Histórico', hist.length]]
        .map(([k, l, n]) => `<button role="tab" aria-selected="${S.aba === k}" data-aba="${k}">${l} <span class="num" style="color:var(--faint)">${n}</span></button>`).join('')}
    </div>`;

  if (S.aba === 'fila' && fila.length) {
    html += bloco({
      tit: 'Ordem da lista de espera',
      desc: 'Quando uma posição é liberada, o primeiro da fila é o próximo a ser promovido para decisão do gestor.',
      corpo: `<ol class="lista">${fila.map((s, i) => `
        <li class="linha-flex" style="gap:12px">
          <span class="num" style="width:28px;height:28px;border-radius:999px;display:grid;place-items:center;font-size:11.5px;font-weight:700;background:${i === 0 ? 'var(--green-bg)' : 'var(--bg)'};color:${i === 0 ? 'var(--green)' : 'var(--muted)'}">${s.posicaoFila || i + 1}º</span>
          <b style="font-size:12.5px">${esc(colabPorId.get(s.colaboradorId).nome)}</b>
          <span style="font-size:12px;color:var(--muted)">${esc(TIPOS_SOLICITACAO[s.tipo].label)} · ${fmData(s.data)}</span>
          ${S.papel === 'planejamento' ? `<button class="btn sm${i === 0 ? ' ok' : ' linha'}" style="margin-left:auto" data-acao="decidir" data-id="${s.id}" data-op="PROMOVER">Promover</button>` : ''}
        </li>`).join('')}</ol>`,
    });
  }

  if (!atual.length) {
    html += bloco({ corpo: vazio('Nada por aqui',
      S.aba === 'abertas' ? 'Não há solicitações aguardando decisão neste momento.'
      : S.aba === 'fila' ? 'A lista de espera está vazia.' : 'Nenhuma solicitação foi concluída ainda.') });
    return html;
  }

  for (const s of atual) html += cartaoSolicitacao(s, eu);
  return html;
}

function cartaoSolicitacao(s, eu) {
  const cfg = STATUS_SOLIC[s.status];
  const tipo = TIPOS_SOLICITACAO[s.tipo];
  const c = colabPorId.get(s.colaboradorId);
  const souParceiro = eu && s.parceiroId === eu.id;
  const aprovador = S.papel === 'planejamento' || S.papel === 'gestor';
  const alteraEscala = ['TROCA_UNIDADE', 'TROCA_HORARIO', 'FOLGA', 'FERIAS'].includes(s.tipo);

  let acoes = '';
  if (souParceiro && s.status === 'AGUARDA_PARCEIRO') {
    acoes += `<button class="btn ok sm" data-acao="decidir" data-id="${s.id}" data-op="ACEITAR_PARCEIRO">Aceitar a troca</button>
      <button class="btn linha sm" data-acao="recusar" data-id="${s.id}" data-op="RECUSAR_PARCEIRO">Recusar a troca</button>`;
  }
  if (S.papel === 'planejamento' && s.status === 'TRIAGEM') {
    acoes += `<button class="btn sm" data-acao="decidir" data-id="${s.id}" data-op="ENCAMINHAR">Encaminhar ao gestor</button>`;
    if (tipo.fila) acoes += `<button class="btn linha sm" data-acao="decidir" data-id="${s.id}" data-op="FILA">Enviar para a lista de espera</button>`;
    acoes += `<button class="btn linha sm" data-acao="recusar" data-id="${s.id}" data-op="RECUSAR_TRIAGEM">Recusar na triagem</button>`;
  }
  if (aprovador && s.status === 'GESTOR') {
    acoes += `<button class="btn ok sm" data-acao="decidir" data-id="${s.id}" data-op="APROVAR">Aprovar</button>
      <button class="btn linha sm" data-acao="recusar" data-id="${s.id}" data-op="RECUSAR_GESTOR">Recusar</button>
      <span style="font-size:11px;color:var(--muted)">${alteraEscala ? 'Aprovar já altera a escala do dia e trava a alocação.' : 'Este tipo não altera a escala — a aprovação vale como registro formal.'}</span>`;
  }

  return bloco({
    tit: `${esc(tipo.label)} · ${fmData(s.data)}`,
    desc: `${esc(c.nome)} · ${esc(c.cargo)} · aberta em ${fmData(s.criadoEm.slice(0, 10))} · SLA de ${tipo.sla}h`,
    acoes: `${s.posicaoFila ? selo(`${s.posicaoFila}º na fila`, 'var(--brand-700)', 'var(--brand-100)') : ''}
      ${souParceiro && s.status === 'AGUARDA_PARCEIRO' ? selo('Aguarda sua resposta', 'var(--amber)', 'var(--amber-bg)') : ''}
      ${s.aplicada ? selo('Aplicada na escala', 'var(--green)', 'var(--green-bg)') : ''}
      ${pilula(cfg.label, cfg.cor, cfg.bg)}`,
    corpo: `<div class="pad" style="display:flex;flex-direction:column;gap:10px">
      <p style="font-size:12.5px;line-height:1.6">${esc(s.detalhe)}</p>
      ${s.parceiroId ? `<p style="font-size:12px;color:var(--muted)">Troca com <b>${esc(colabPorId.get(s.parceiroId).nome)}</b>${s.aceiteParceiro ? ` · resposta do parceiro: ${s.aceiteParceiro.toLowerCase()}` : ''}</p>` : ''}
      ${s.unidadeDesejadaId ? `<p style="font-size:12px;color:var(--muted)">Unidade desejada: <b>${esc(unidadePorId.get(s.unidadeDesejadaId).nome)}</b></p>` : ''}
      ${s.motivoRecusa ? `<div style="background:var(--rose-bg);color:var(--rose);border-radius:6px;padding:8px 12px;font-size:12px"><b>Motivo da recusa:</b> ${esc(s.motivoRecusa)}</div>` : ''}
      <details style="font-size:12px">
        <summary style="cursor:pointer;font-weight:600;color:var(--brand-700)">Histórico (${s.eventos.length})</summary>
        <ol class="lista" style="border-left:1px solid var(--line-2);margin:8px 0 0 4px;padding-left:14px">
          ${s.eventos.map(e => `<li style="border:0;padding:6px 0">
            <b>${esc(e.etapa)}</b>
            <div style="color:var(--muted)">${esc(e.por)} · ${esc(e.em)}</div>
            ${e.detalhe ? `<div style="color:var(--muted);margin-top:2px">${esc(e.detalhe)}</div>` : ''}</li>`).join('')}
        </ol>
      </details>
      ${acoes ? `<div class="linha-flex">${acoes}</div>` : ''}
    </div>`,
  });
}

/* ============================================================
   TELA — Minha escala
   ============================================================ */
function telaMinhaEscala() {
  const eu = euSou();
  const g = geracao();
  const [ano, mes] = partesIso(S.competencia);
  const nDias = diasNoMes(ano, mes);
  const publicada = g && g.status !== 'rascunho';

  let html = `
    <div class="linha-flex" style="justify-content:space-between">
      <div><h1 style="font-size:17px">Minha escala</h1>
        <p style="font-size:12px;color:var(--muted);margin-top:2px">${esc(eu.nome)} · ${esc(eu.cargo)} · ${fmComp(S.competencia)}</p></div>
      ${seletorMes()}
    </div>`;

  if (!publicada) {
    html += bloco({ corpo: vazio(`A escala de ${fmComp(S.competencia)} ainda não foi publicada`,
      'Enquanto está em rascunho, a escala fica invisível para o colaborador — no sistema real isso é uma policy de RLS, não um filtro de tela. Você continua podendo abrir solicitações abaixo.') });
  } else {
    const minhas = g.alocacoes.filter(a => a.colaboradorId === eu.id);
    const porData = new Map(minhas.map(a => [a.data, a]));
    const faixa = dow => {
      const h = eu.sextaReduzida && dow === 5 ? eu.jornada - 1 : eu.jornada;
      return `${eu.entrada}–${somaHoras(eu.entrada, h + (h > 6 ? 1 : 0))}`;
    };
    const proximos = minhas.filter(a => a.modalidade !== 'DESCANSO').slice(0, 4);

    html += `<div class="grade g4">${proximos.map(a => {
      const ap = apar(a.modalidade, a.unidadeId);
      const dow = dowDeIso(a.data);
      const ausente = ['FERIAS','FOLGA','AFAST','FERIADO'].includes(a.modalidade);
      return `<div class="kpi destaque" style="border-left-color:${ap.cor}">
        <span class="rotulo">${DIAS_ABREV[dow]}, ${fmData(a.data)}</span>
        <div style="font-size:15px;font-weight:600;color:${ap.cor}">${esc(ap.label)}</div>
        ${ausente ? '' : `<div class="num" style="font-size:12px;color:var(--muted);margin-top:3px">${faixa(dow)}</div>`}
      </div>`;
    }).join('')}</div>`;

    let cels = '';
    for (let i = 0; i < diaSemana(ano, mes, 1); i++) cels += '<div></div>';
    for (let d = 1; d <= nDias; d++) {
      const data = iso(ano, mes, d);
      const a = porData.get(data);
      const ap = a ? apar(a.modalidade, a.unidadeId) : null;
      const mostra = a && a.modalidade !== 'DESCANSO';
      const trabalha = mostra && !['FERIAS','FOLGA','AFAST','FERIADO'].includes(a.modalidade);
      cels += `<div class="dia" style="cursor:default;background:${mostra ? ap.bg : 'var(--bg)'}">
        <span class="dia-num" style="color:${mostra ? ap.cor : 'var(--faint)'}">${d}</span>
        ${mostra ? `<div style="margin-top:auto"><div style="font-size:10px;font-weight:700;color:${ap.cor}">${esc(ap.sigla)}</div>
          ${trabalha ? `<div class="num" style="font-size:9px;color:${ap.cor}">${eu.entrada}</div>` : ''}</div>` : ''}
        ${FERIADOS[data] ? `<span style="font-size:8.5px;color:var(--amber);margin-top:auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(FERIADOS[data])}</span>` : ''}
      </div>`;
    }

    html += bloco({
      tit: `Calendário de ${fmComp(S.competencia)}`,
      corpo: `<div class="pad">
        <div class="cal" style="margin-bottom:6px">${DIAS_ABREV.map(d => `<div class="cal-cab">${d}</div>`).join('')}</div>
        <div class="cal">${cels}</div>
      </div>
      <div class="legenda">${UNIDADES.map(u => selo(`${u.sigla} · ${u.nome}`, u.cor, u.bg)).join('')}
        ${selo('HO · Home Office', '#6D28D9', '#EDE9FE')}${selo('FÉR · Férias', '#B45309', '#FEF3C7')}${selo('AUS · Ausência', '#526176', '#F1F5F9')}</div>`,
    });
  }

  const colegas = COLABORADORES.filter(c => c.id !== eu.id && c.status === 'ativo' && c.regime === eu.regime && c.equipeId === eu.equipeId);
  html += bloco({
    tit: 'Abrir solicitação',
    desc: 'Troca de plantão precisa do aceite do colega, depois passa pela triagem do Planejamento e só então vai ao gestor.',
    corpo: `<div class="pad" style="display:flex;flex-direction:column;gap:12px">
      <div class="grade g3">
        <label><span class="rotulo">Tipo</span>
          <select id="ns-tipo" class="campo">${Object.entries(TIPOS_SOLICITACAO).map(([k, v]) => `<option value="${k}">${esc(v.label)}</option>`).join('')}</select></label>
        <label><span class="rotulo">Data de referência</span><input type="date" id="ns-data" class="campo" value="${iso(...partesIso(S.competencia).slice(0, 2), 15)}"></label>
        <label id="ns-extra-wrap"><span class="rotulo">Complemento</span><select id="ns-extra" class="campo"></select></label>
      </div>
      <label><span class="rotulo">Justificativa</span>
        <textarea id="ns-detalhe" rows="3" class="campo" placeholder="Explique o motivo do pedido — é o que o gestor lê para decidir."></textarea></label>
      <div class="linha-flex">
        <button class="btn" data-acao="abrir-solic">Enviar solicitação</button>
        <span id="ns-dica" style="font-size:11.5px;color:var(--muted)"></span>
      </div>
      ${colegas.length === 0 ? `<p style="font-size:11.5px;color:var(--amber)">Não há colegas do mesmo regime e equipe para troca de plantão.</p>` : ''}
    </div>`,
  });

  const minhasSolic = S.solicitacoes.filter(s => s.colaboradorId === eu.id || s.parceiroId === eu.id);
  html += bloco({
    tit: `Minhas solicitações (${minhasSolic.length})`,
    corpo: minhasSolic.length ? `<ul class="lista">${minhasSolic.map(s => {
      const cfg = STATUS_SOLIC[s.status];
      const aguarda = s.parceiroId === eu.id && s.status === 'AGUARDA_PARCEIRO';
      return `<li>
        <div class="linha-flex">
          <b style="font-size:12.5px">${esc(TIPOS_SOLICITACAO[s.tipo].label)}</b>
          <span class="num" style="font-size:12px;color:var(--muted)">${fmData(s.data)}</span>
          ${s.posicaoFila ? selo(`${s.posicaoFila}º na fila`, 'var(--brand-700)', 'var(--brand-100)') : ''}
          ${aguarda ? selo('Aguarda sua resposta', 'var(--amber)', 'var(--amber-bg)') : ''}
          <span style="margin-left:auto">${pilula(cfg.label, cfg.cor, cfg.bg)}</span>
        </div>
        <p style="font-size:12px;color:var(--muted);margin-top:4px">${esc(s.detalhe)}</p>
        ${s.motivoRecusa ? `<p style="font-size:11.5px;background:var(--rose-bg);color:var(--rose);border-radius:5px;padding:5px 9px;margin-top:6px">Motivo da recusa: ${esc(s.motivoRecusa)}</p>` : ''}
        ${aguarda ? `<button class="btn sm" style="margin-top:8px" data-ir="solicitacoes">Responder à troca</button>` : ''}
      </li>`;
    }).join('')}</ul>` : vazio('Nenhuma solicitação', 'Os pedidos que você abrir e as trocas em que for convidado aparecem aqui.'),
  });
  return html;
}

function pendentesDoPapel() {
  const eu = euSou();
  if (S.papel === 'planejamento') return S.solicitacoes.filter(s => s.status === 'TRIAGEM').length;
  if (S.papel === 'gestor') {
    const meus = new Set(visiveis().map(c => c.id));
    return S.solicitacoes.filter(s => s.status === 'GESTOR' && meus.has(s.colaboradorId)).length;
  }
  return S.solicitacoes.filter(s => s.status === 'AGUARDA_PARCEIRO' && s.parceiroId === eu?.id).length;
}

function seletorMes() {
  const [ano, mes] = partesIso(S.competencia);

const TELAS = {

function render() {
  const menu = MENUS[S.papel];
  const permitidas = menu.flatMap(g => g.itens).map(i => i.id);
  if (!permitidas.includes(S.tela)) S.tela = permitidas[0];
  const pend = pendentesDoPapel();

  document.getElementById('rail').innerHTML = menu.map(g => `
    ${g.secao ? `<div class="rail-secao">${g.secao}</div>` : ''}
    ${g.itens.map(i => `<a href="#${i.id}" data-tela="${i.id}"${S.tela === i.id ? ' aria-current="page"' : ''}>
      <span>${i.label}</span>${i.id === 'solicitacoes' && pend ? `<span class="marcador num">${pend}</span>` : ''}</a>`).join('')}`).join('');

  document.getElementById('papel').value = S.papel;
  document.getElementById('quem').textContent = PAPEIS[S.papel].nome;
  const g = geracao();
  document.getElementById('chip-mes').innerHTML =
    `${fmComp(S.competencia)}<span class="div"></span><span style="color:rgba(255,255,255,.75)">${g ? { rascunho: 'Rascunho', publicada: 'Publicada', encerrada: 'Encerrada' }[g.status] : 'Não gerada'}</span>`;

  // Mensagem com destino próprio (`onde`) sai junto do controle que a gerou;
  // o resto vai para o topo.
  const rec = S.recado && !S.recado.onde
    ? `<div class="aviso" style="border-color:${S.recado.erro ? 'var(--rose)' : 'var(--green)'};background:${S.recado.erro ? 'var(--rose-bg)' : 'var(--green-bg)'};color:${S.recado.erro ? 'var(--rose)' : 'var(--green)'}" role="status">${esc(S.recado.msg)}</div>`
    : '';
  const destinoRecado = S.recado?.onde ?? null;
  const campoParaFocar = S.recado?.foco ?? null;
  // Quem estava digitando num filtro precisa continuar digitando depois do
  // re-render — sem isso a busca perde o foco a cada tecla.
  const focado = document.activeElement;
  const idFoco = focado && focado.dataset && focado.dataset.filtro ? focado.id : null;
  const caret = idFoco && focado.selectionStart !== undefined ? focado.selectionStart : null;

  document.getElementById('principal').innerHTML = rec + TELAS[S.tela]();
  S.recado = null;

  if (idFoco) {
    const novo = document.getElementById(idFoco);
    if (novo) {
      novo.focus();
      if (caret !== null && novo.setSelectionRange) novo.setSelectionRange(caret, caret);
    }
  }
  if (S.tela === 'planos' && S.colabAberto) {
    atualizarSoma(); montarMotivos(); ajustarPaineisHo(); desenharFixas();
  }
  if (S.tela === 'minha-escala') ajustarNovaSolic();

  // Leva a mensagem local ao campo de visão — o editor é longo o bastante para
  // ela nascer fora da tela.
  if (destinoRecado) {
    document.getElementById(`recado-${destinoRecado}`)
      ?.scrollIntoView({ block: 'center', behavior: 'smooth' });
    // Erro de campo devolve o cursor ao campo que precisa ser corrigido.
    if (campoParaFocar) document.getElementById(campoParaFocar)?.focus();
  }
}

let distEdit = {};
function atualizarSoma() {
  const c = colabPorId.get(S.colabAberto);

  if (!Object.keys(distEdit).length) {
    distEdit = plano ? { ...plano.distribuicao } : { [c.unidadeBaseId]: 100 };
  }
  const soma = UNIDADES.reduce((a, u) => a + (distEdit[u.id] || 0), 0);
  const el = document.getElementById('soma-dist');
  if (el) { el.textContent = `Total ${soma}%`; el.style.color = soma === 100 ? 'var(--green)' : 'var(--rose)'; }
  document.querySelectorAll('.deg').forEach(b => {

    b.style.borderColor = ativo ? u.cor : 'var(--line-2)';
  });
}

/* ── Unidade fixa por dia da semana ──────────────────────
   Estado local do editor; só vai para o plano ao salvar. */
let fixasEdit = {};

const DIAS_LONGOS = ['Domingo', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado'];

/** Lista em português: "terça", "terça e quarta", "terça, quarta e sexta". */
function listar(itens) {
  if (itens.length <= 1) return itens[0] || '';
  return itens.slice(0, -1).join(', ') + ' e ' + itens[itens.length - 1];
}

function desenharFixas() {
  const alvo = document.getElementById('fixas');
  if (!alvo) return;
  const hoFixos = [...document.querySelectorAll('.ed-hofixo:checked')].map(i => Number(i.value));
  const modoHo = document.querySelector('.ed-homodo:checked')?.value || '';

  alvo.innerHTML = UTEIS.map(d => {
    const atual = fixasEdit[d];
    const conflito = modoHo === 'FIXO' && hoFixos.includes(d) && atual !== undefined;
    const opcao = (valor, rotulo, cor) => {
      const ativo = valor === '' ? atual === undefined : atual === valor;
      return `<button type="button" data-fixa="${d}" data-fixaun="${valor}" aria-pressed="${ativo}"
        style="${ativo && cor ? `background:${cor};border-color:${cor}` : ''}${ativo && !cor ? 'background:var(--muted);' : ''}">${esc(rotulo)}</button>`;
    };
    return `<div class="fixa-linha">
      <span class="fixa-dia">${DIAS_LONGOS[d]}</span>
      <div class="segmento">
        ${opcao('', 'Livre', null)}
        ${UNIDADES.map(u => opcao(u.id, u.nome, u.cor)).join('')}
      </div>
      ${conflito ? `<span class="fixa-nota">também marcado como home office fixo</span>` : ''}
    </div>`;
  }).join('');

  // Resumo em linguagem natural: confere se o que foi montado é o que se quis dizer.
  const porUnidade = new Map();
  for (const [dow, un] of Object.entries(fixasEdit)) {
    porUnidade.set(un, [...(porUnidade.get(un) || []), Number(dow)]);
  }
  const resumo = document.getElementById('fixas-resumo');
  const nFixos = Object.keys(fixasEdit).length;
  if (nFixos === 0) {
    resumo.innerHTML = `<p class="ajuda">Nenhum dia fixo — os 5 dias úteis entram na distribuição percentual.</p>`;
    return;
  }
  const frases = [...porUnidade.entries()].map(([un, dias]) => {
    const u = unidadePorId.get(Number(un));
    const nomes = dias.sort((a, b) => a - b).map(d => DIAS_LONGOS[d].toLowerCase());
    return `<b>${listar(nomes)}</b> ${dias.length > 1 ? 'fixas' : 'fixa'} no ${esc(u.nome)}`;
  });
  const livres = 5 - nFixos;
  resumo.innerHTML = `<div class="resumo">${frases.join(' · ')}.
    ${livres === 0 ? 'A semana inteira está fixada — a distribuição percentual deixa de ter efeito.'
      : livres === 1 ? 'Resta 1 dia útil para a distribuição percentual.'
      : `Restam ${livres} dias úteis para a distribuição percentual.`}</div>`;
}

/** Mostra só o painel do modo escolhido: três blocos de checkbox ao mesmo

/* ── CSV: separador ; e BOM UTF-8, que é o que o Excel pt-BR abre certo ── */
function baixarCsv(linhas, nome) {
  const escapar = v => /[;"\n]/.test(String(v ?? '')) ? `"${String(v).replace(/"/g, '""')}"` : String(v ?? '');
  const csv = linhas.map(l => l.map(escapar).join(';')).join('\r\n');
  const url = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' }));
  const a = document.createElement('a');
  a.href = url; a.download = nome; a.click();
  URL.revokeObjectURL(url);
}
