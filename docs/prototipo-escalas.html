<script>
/* ============================================================
   MOTOR — transliteração fiel de src/lib/domain/escalas/motor.ts
   Mesma precedência, mesmos desempates, mesma saída. Roda aqui no
   navegador só porque não há banco: no sistema real ele roda no
   servidor e a mesma chamada serve à simulação e à gravação.
   ============================================================ */
const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const DIAS_ABREV = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const DIAS_INICIAL = ['D','S','T','Q','Q','S','S'];

const pad = n => String(n).padStart(2, '0');
const iso = (a, m, d) => `${a}-${pad(m + 1)}-${pad(d)}`;
const diasNoMes = (a, m) => new Date(a, m + 1, 0).getDate();
const diaSemana = (a, m, d) => new Date(a, m, d).getDay();
const partesIso = s => { const [a, m, d] = s.split('-').map(Number); return [a, m - 1, d]; };
const dowDeIso = s => { const [a, m, d] = partesIso(s); return new Date(a, m, d).getDay(); };
const addDias = (s, n) => { const [a, m, d] = partesIso(s); const dt = new Date(a, m, d + n); return iso(dt.getFullYear(), dt.getMonth(), dt.getDate()); };
const diffDias = (a, b) => { const [ay,am,ad] = partesIso(a), [by,bm,bd] = partesIso(b); return Math.round((Date.UTC(by,bm,bd) - Date.UTC(ay,am,ad)) / 86400000); };
const fmData = s => s.split('-').reverse().join('/');
const fmComp = s => { const [a, m] = partesIso(s); return `${MESES[m]} ${a}`; };
const fimAusencia = (ini, dias) => addDias(ini, Math.max(1, dias) - 1);

function somaHoras(hhmm, horas) {
  const [h, m] = hhmm.split(':').map(Number);
  const t = h * 60 + m + Math.round(horas * 60);
  const n = ((t % 1440) + 1440) % 1440;
  return `${pad(Math.floor(n / 60))}:${pad(n % 60)}`;
}

/* Paridade do 12x36 pela contagem de dias desde o mês âncora — exata em
   qualquer direção, inclusive em fevereiro bissexto. */
function cicloEfetivo(cicloBase, competencia, ancora) {
  const inverte = Math.abs(diffDias(ancora, competencia)) % 2 === 1;
  if (!inverte) return cicloBase;
  return cicloBase === 'IMPAR' ? 'PAR' : 'IMPAR';
}

const MODALIDADES = {
  HOME:     { label: 'Home Office',      sigla: 'HO',  cor: '#6D28D9', bg: '#EDE9FE' },
  EXTERNO:  { label: 'Trabalho Externo', sigla: 'EXT', cor: '#0A6E8A', bg: '#CFFAFE' },
  EVENTO:   { label: 'Evento',           sigla: 'EVT', cor: '#C2410C', bg: '#FFEDD5' },
  TREINA:   { label: 'Treinamento',      sigla: 'TRE', cor: '#7C3AED', bg: '#F3E8FF' },
  FERIAS:   { label: 'Férias',           sigla: 'FÉR', cor: '#B45309', bg: '#FEF3C7' },
  FOLGA:    { label: 'Ausência',         sigla: 'AUS', cor: '#526176', bg: '#F1F5F9' },
  FERIADO:  { label: 'Feriado',          sigla: 'FRD', cor: '#A16207', bg: '#FEF9C3' },
  AFAST:    { label: 'Afastamento',      sigla: 'AFA', cor: '#BE123C', bg: '#FFE4E9' },
  DESCANSO: { label: 'Descanso',         sigla: '—',   cor: '#5B6B80', bg: '#F1F5F9' },
};

const LIMITE_CONCENTRACAO_EQUIPE = 4;

function gerarEscala(input) {
  const { ano, mes, feriados, cicloAncora, toleranciaAderencia, coberturaMinima } = input;
  const nDias = diasNoMes(ano, mes);
  const competencia = iso(ano, mes, 1);
  const unidades = input.unidades.filter(u => u.ativa).slice().sort((a, b) => a.ordem - b.ordem || a.id - b.id);
  const ids = unidades.map(u => u.id);
  const nomeUn = new Map(unidades.map(u => [u.id, u.nome]));

  // Ordem estável: duas gerações com os mesmos dados não podem divergir.
  const colaboradores = input.colaboradores.filter(c => c.status === 'ativo').slice().sort((a, b) => a.id - b.id);

  const planoPor = new Map(input.planos.map(p => [p.colaboradorId, p]));
  const pinPor = new Map(input.pins.map(p => [`${p.colaboradorId}|${p.data}`, p]));

  const ausPor = new Map();
  for (const a of input.ausencias) {
    const l = ausPor.get(a.colaboradorId) || [];
    l.push({ tipo: a.tipo, inicio: a.inicio, fim: fimAusencia(a.inicio, a.dias) });
    ausPor.set(a.colaboradorId, l);
  }

  const capEsp = new Map(), capSem = new Map();
  for (const c of input.capacidades) {
    const v = { total: c.total, reservadas: c.reservadas };
    if (c.data) capEsp.set(`${c.unidadeId}|${c.data}`, v);
    else if (c.dow !== null && c.dow !== undefined) capSem.set(`${c.unidadeId}|${c.dow}`, v);
  }

  const posicoes = (u, data, dow) => {
    const cfg = capEsp.get(`${u.id}|${data}`) || capSem.get(`${u.id}|${dow}`) || { total: u.capacidadeTotal, reservadas: u.capacidadeReservadas };
    return Math.max(0, cfg.total - cfg.reservadas);
  };

  const conflitos = [], alertas = [], datas = [];
  for (let d = 1; d <= nDias; d++) datas.push(iso(ano, mes, d));

  const escala = new Map();
  const ocupacao = {}, capacidadeDia = {};
  for (const data of datas) {
    ocupacao[data] = Object.fromEntries(ids.map(i => [i, 0]));
    const dow = diaSemana(ano, mes, Number(data.slice(8)));
    capacidadeDia[data] = Object.fromEntries(unidades.map(u => [u.id, posicoes(u, data, dow)]));
  }

  const definir = (cid, data, modalidade, unidadeId, travado = false) => {
    const dias = escala.get(cid) || new Map();
    dias.set(data, { modalidade, unidadeId, travado });
    escala.set(cid, dias);
  };

  // ── Regras 1 a 8: tudo que é rígido, pessoa a pessoa.
  const presenciais = new Map(), fixados = new Map(), cotaRestante = new Map();
  const dowPrimeiro = diaSemana(ano, mes, 1);
  const semanaDoMes = dia => Math.floor((dia + dowPrimeiro - 1) / 7);

  for (const c of colaboradores) {
    const plano = planoPor.get(c.id);
    const livres = [], fixos = new Set();
    presenciais.set(c.id, livres);
    fixados.set(c.id, fixos);

    const ausencias = ausPor.get(c.id) || [];
    const ho = plano && plano.homeOffice;
    const unidadesFixas = (plano && plano.unidadesFixas) || {};
    const cicloBase = (plano && plano.ciclo) || c.ciclo || 'IMPAR';
    const ciclo = c.regime === '12x36'
      ? ((plano && plano.ciclo) || cicloEfetivo(cicloBase, competencia, cicloAncora))
      : 'IMPAR';
    let ultimoPlantao = null;

    for (let d = 1; d <= nDias; d++) {
      const data = datas[d - 1];
      const dow = diaSemana(ano, mes, d);

      // 1. Trava manual — decisão já tomada.
      const pin = pinPor.get(`${c.id}|${data}`);
      if (pin) {
        definir(c.id, data, pin.modalidade, pin.unidadeId, true);
        if (pin.modalidade === 'UNIDADE' && pin.unidadeId !== null) fixos.add(data);
        if (c.regime === '12x36' && pin.modalidade !== 'DESCANSO') ultimoPlantao = d;
        continue;
      }

      // 2/3. Férias e ausências — bloqueio absoluto, mesmo iniciadas em outro mês.
      const aus = ausencias.find(a => data >= a.inicio && data <= a.fim);
      if (aus) { definir(c.id, data, aus.tipo === 'FERIAS' ? 'FERIAS' : 'FOLGA', null); continue; }

      // 4. Regime de trabalho.
      if (c.regime === '12x36') {
        const trabalha = (ciclo === 'IMPAR') === (d % 2 === 1);
        if (!trabalha) { definir(c.id, data, 'DESCANSO', null); continue; }
        if (ultimoPlantao === d - 1) {
          conflitos.push({ nivel: 'erro', colaborador: c.nome, data, msg: 'Plantões 12x36 em dias consecutivos — o descanso de 36h fica violado.' });
        }
        ultimoPlantao = d;
      } else {
        if (dow === 0 || dow === 6) { definir(c.id, data, 'DESCANSO', null); continue; }
        if (feriados[data]) { definir(c.id, data, 'FERIADO', null); continue; }
      }

      const uFixa = unidadesFixas[dow];
      const temFixa = uFixa !== undefined && ids.includes(uFixa);

      // 5. Home office fixo.
      if (c.elegHome && ho && ho.modo === 'FIXO' && ho.diasSemana.includes(dow)) {
        if (temFixa) {
          conflitos.push({ nivel: 'erro', colaborador: c.nome, data, msg: `${DIAS_ABREV[dow]} está marcado como home office fixo e como unidade fixa (${nomeUn.get(uFixa)}) ao mesmo tempo.` });
        }
        definir(c.id, data, 'HOME', null); continue;
      }

      // 6. Unidade fixa do dia da semana — ocupa posição, sai do rateio livre.
      if (temFixa) { definir(c.id, data, 'UNIDADE', uFixa); livres.push(data); fixos.add(data); continue; }

      // 8 (1ª passada). Cota semanal nos dias preferidos.
      if (c.elegHome && ho && ho.modo === 'COTA') {
        const sem = semanaDoMes(d);
        const porSem = cotaRestante.get(c.id) || new Map();
        if (!porSem.has(sem)) porSem.set(sem, ho.quantidade);
        cotaRestante.set(c.id, porSem);
        if (!ho.diasProibidos.includes(dow) && ho.diasPreferencia.includes(dow) && porSem.get(sem) > 0) {
          porSem.set(sem, porSem.get(sem) - 1);
          definir(c.id, data, 'HOME', null); continue;
        }
      }
      livres.push(data);
    }
  }

  // ── Regra 8 (2ª passada): completa a cota que a preferência não cobriu.
  for (const c of colaboradores) {
    if (!c.elegHome) continue;
    const plano = planoPor.get(c.id);
    const ho = plano && plano.homeOffice;
    if (!ho || ho.modo !== 'COTA') continue;
    const porSem = cotaRestante.get(c.id);
    if (!porSem) continue;
    for (const [sem, restante] of porSem) {
      let falta = restante;
      if (falta <= 0) continue;
      for (const data of [...(presenciais.get(c.id) || [])]) {
        if (falta <= 0) break;
        const dia = Number(data.slice(8));
        if (semanaDoMes(dia) !== sem) continue;
        if (ho.diasProibidos.includes(diaSemana(ano, mes, dia))) continue;
        if (fixados.get(c.id).has(data)) continue;
        definir(c.id, data, 'HOME', null);
        presenciais.set(c.id, presenciais.get(c.id).filter(x => x !== data));
        falta--;
      }
      if (falta > 0) {
        alertas.push({ nivel: 'aviso', colaborador: c.nome, msg: `Cota de home office não atendida na semana ${sem + 1}: faltam ${falta} dia(s) elegíveis.` });
      }
    }
  }

  // ── Regra 9: metas por unidade, método do maior resto.
  const metas = {};
  for (const c of colaboradores) {
    const plano = planoPor.get(c.id);
    const dist = (plano && plano.distribuicao) || {};
    const soma = ids.reduce((a, i) => a + (dist[i] || 0), 0);
    const efetiva = soma > 0 ? dist : { [c.unidadeBaseId]: 100 };
    const divisor = soma > 0 ? soma : 100;
    const total = (presenciais.get(c.id) || []).length;
    const base = ids.map(i => {
      const exato = (total * (efetiva[i] || 0)) / divisor;
      return { id: i, piso: Math.floor(exato), resto: exato - Math.floor(exato) };
    });
    let sobra = total - base.reduce((a, b) => a + b.piso, 0);
    // Empate no resto: menor id primeiro, para a geração ser reprodutível.
    [...base].sort((a, b) => b.resto - a.resto || a.id - b.id).forEach(b => { if (sobra > 0) { b.piso++; sobra--; } });
    metas[c.id] = Object.fromEntries(base.map(b => [b.id, b.piso]));
  }

  const alocado = {};
  for (const c of colaboradores) alocado[c.id] = Object.fromEntries(ids.map(i => [i, 0]));

  // ── Regras 7 e 11: preenche o dia com capacidade e balanceamento.
  for (let d = 1; d <= nDias; d++) {
    const data = datas[d - 1];
    const cap = capacidadeDia[data];

    for (const c of colaboradores) {
      const dec = escala.get(c.id) && escala.get(c.id).get(data);
      if (!dec || dec.modalidade !== 'UNIDADE' || dec.unidadeId === null) continue;
      ocupacao[data][dec.unidadeId]++;
      alocado[c.id][dec.unidadeId]++;
    }

    for (const u of unidades) {
      if (ocupacao[data][u.id] <= cap[u.id]) continue;
      const nomes = colaboradores.filter(c => {
        const a = escala.get(c.id) && escala.get(c.id).get(data);
        return a && a.modalidade === 'UNIDADE' && a.unidadeId === u.id;
      }).map(c => c.nome);
      conflitos.push({ nivel: 'erro', data, msg: `${u.nome} em ${fmData(data)} tem ${ocupacao[data][u.id]} pessoas fixadas para ${cap[u.id]} posições. Revise as travas e unidades fixas de: ${nomes.slice(0, 6).join(', ')}${nomes.length > 6 ? '…' : ''}.` });
    }

    const candidatos = colaboradores
      .filter(c => (presenciais.get(c.id) || []).includes(data) && !(escala.get(c.id) && escala.get(c.id).get(data)))
      .map(c => {
        const faltas = ids.map(i => ({ id: i, falta: (metas[c.id][i] || 0) - alocado[c.id][i] }));
        const maior = faltas.reduce((a, b) => (b.falta > a.falta ? b : a), faltas[0]);
        return { c, preferida: maior.id, urgencia: maior.falta, flex: faltas.filter(f => f.falta > 0).length };
      })
      .sort((a, b) => a.flex - b.flex || b.urgencia - a.urgencia || a.c.id - b.c.id);

    const conc = Object.fromEntries(ids.map(i => [i, {}]));

    for (const { c, preferida } of candidatos) {
      const ordem = [preferida, ...ids.filter(i => i !== preferida)];
      let colocado = false;
      for (const i of ordem) {
        if (ocupacao[data][i] >= cap[i]) continue;
        const n = conc[i][c.equipeId] || 0;
        const alt = ordem.find(x => x !== i && ocupacao[data][x] < cap[x]);
        if (i !== preferida && alt !== undefined && n > LIMITE_CONCENTRACAO_EQUIPE) continue;
        definir(c.id, data, 'UNIDADE', i);
        ocupacao[data][i]++; alocado[c.id][i]++; conc[i][c.equipeId] = n + 1;
        colocado = true; break;
      }
      if (!colocado) {
        definir(c.id, data, 'EXTERNO', null);
        const det = unidades.map(u => `${u.nome} ${ocupacao[data][u.id]}/${cap[u.id]}`).join(', ');
        conflitos.push({ nivel: 'erro', colaborador: c.nome, data, msg: `Sem posição disponível em nenhuma unidade (${det}). Alocado como Trabalho Externo.` });
      }
    }

    const alguem = colaboradores.some(c => {
      const a = escala.get(c.id) && escala.get(c.id).get(data);
      return a && a.modalidade !== 'DESCANSO' && a.modalidade !== 'FERIADO';
    });
    if (alguem && coberturaMinima > 0) {
      for (const u of unidades) {
        if (ocupacao[data][u.id] < coberturaMinima) {
          alertas.push({ nivel: 'aviso', data, msg: `${u.nome} com ${ocupacao[data][u.id]} pessoa(s) em ${fmData(data)} — abaixo da cobertura mínima de ${coberturaMinima}.` });
        }
      }
    }
  }

  // ── Aderência: planejado x realizado.
  const aderencia = colaboradores.map(c => {
    const desvios = ids.map(i => ({ unidadeId: i, planejado: metas[c.id][i] || 0, realizado: alocado[c.id][i] || 0 }));
    const ok = desvios.every(x => Math.abs(x.planejado - x.realizado) <= toleranciaAderencia);
    if (!ok) {
      alertas.push({ nivel: 'aviso', colaborador: c.nome, msg: `Distribuição fora da tolerância: ${desvios.map(x => `${nomeUn.get(x.unidadeId)} ${x.realizado}/${x.planejado}`).join(' · ')}` });
    }
    return { colaboradorId: c.id, colaborador: c.nome, desvios, ok };
  });

  const alocacoes = [];
  for (const c of colaboradores) {
    const dias = escala.get(c.id);
    if (!dias) continue;
    for (const data of datas) {
      const a = dias.get(data);
      if (a) alocacoes.push({ colaboradorId: c.id, data, modalidade: a.modalidade, unidadeId: a.unidadeId, travado: a.travado });
    }
  }

  return { alocacoes, conflitos, alertas, ocupacao, capacidadeDia, aderencia, metas };
}

/* Pré-checagem: enquanto houver pendência a geração fica bloqueada. */
function checarPlanos({ colaboradores, planos, ausencias, unidades }) {
  const pend = [];
  const ids = unidades.filter(u => u.ativa).map(u => u.id);
  const planoPor = new Map(planos.map(p => [p.colaboradorId, p]));
  const ausPor = new Map();
  for (const a of ausencias) ausPor.set(a.colaboradorId, [...(ausPor.get(a.colaboradorId) || []), a]);

  for (const c of colaboradores.filter(x => x.status === 'ativo')) {
    const add = msg => pend.push({ colaboradorId: c.id, colaborador: c.nome, msg });
    const p = planoPor.get(c.id);
    if (!p) { add('Sem plano configurado para o mês.'); }
    else {
      const soma = ids.reduce((a, i) => a + (p.distribuicao[i] || 0), 0);
      if (soma !== 100) add(`A distribuição entre unidades soma ${soma}% — precisa somar 100%.`);
      if (c.regime === '12x36' && !p.ciclo) add('Regime 12x36 sem ciclo definido para o mês.');
      const ho = p.homeOffice;
      if (ho.modo === 'FIXO') {
        if (!ho.diasSemana.length) add('Home office fixo sem nenhum dia da semana selecionado.');
        for (const dow of ho.diasSemana) {
          if (p.unidadesFixas[dow] !== undefined) add(`${DIAS_ABREV[dow]} está marcado ao mesmo tempo como home office fixo e como unidade fixa.`);
        }
      }
      if (ho.modo === 'COTA' && ho.quantidade < 1) add('Cota de home office precisa de pelo menos 1 dia por semana.');
      if (ho.modo && !c.elegHome) add('Home office configurado, mas o colaborador não está marcado como elegível.');
    }
    const lista = (ausPor.get(c.id) || []).slice().sort((a, b) => a.inicio.localeCompare(b.inicio));
    for (let i = 0; i < lista.length; i++) {
      const a = lista[i];
      if (!a.inicio) { add('Ausência sem data de início.'); continue; }
      if (!a.dias || a.dias < 1) { add('Ausência sem quantidade de dias.'); continue; }
      if (a.tipo === 'AUSENCIA' && (!a.grupo || !a.motivo)) add('Ausência sem grupo ou motivo preenchido.');
      for (let j = i + 1; j < lista.length; j++) {
        const b = lista[j];
        if (a.inicio <= fimAusencia(b.inicio, b.dias) && b.inicio <= fimAusencia(a.inicio, a.dias)) {
          add(`Duas ausências se sobrepõem a partir de ${fmData(b.inicio)}.`);
        }
      }
    }
  }
  return pend;
}

/* Planos do mês: mesma distribuição do protótipo original. */
function montarPlanos(competencia) {
  return COLABORADORES.map((c, i) => {
    const outra = c.unidadeBaseId === 1 ? 2 : 1;
    const distribuicao = c.regime === '12x36'
      ? { [c.unidadeBaseId]: 100, [outra]: 0 }
      : i % 3 === 0 ? { 1: 75, 2: 25 }
      : i % 3 === 1 ? { 1: 100, 2: 0 }
      : { 1: 50, 2: 50 };
    const homeOffice =
      c.elegHome && i % 4 === 0 ? { modo: 'FIXO', diasSemana: [2, 4], quantidade: 0, diasPreferencia: [], diasProibidos: [] }
      : c.elegHome && i % 4 === 1 ? { modo: 'COTA', diasSemana: [], quantidade: 2, diasPreferencia: [1, 3], diasProibidos: [5] }
      : { modo: null, diasSemana: [], quantidade: 0, diasPreferencia: [], diasProibidos: [] };
    return {
      colaboradorId: c.id, competencia,
      ciclo: c.regime === '12x36' ? c.ciclo : null,
      distribuicao, unidadesFixas: {}, homeOffice,
    };
  });
}

/**

function recadoLocal(onde) {
  const r = S.recado;
  if (!r || r.onde !== onde) return `<div id="recado-${onde}"></div>`;
  return `<div id="recado-${onde}" class="aviso" style="margin-top:10px;border-color:${r.erro ? 'var(--rose)' : 'var(--green)'};background:${r.erro ? 'var(--rose-bg)' : 'var(--green-bg)'};color:${r.erro ? 'var(--rose)' : 'var(--green)'}" role="status">${esc(r.msg)}</div>`;
}

/** Monta uma barra de filtros a partir de uma descrição declarativa. */
function barraFiltros(campos, contagem) {
  return `<div class="filtros">
    ${campos.map(c => {
      if (c.tipo === 'busca') {
        return `<label class="f-busca"><span class="rotulo">${esc(c.label)}</span>
          <input class="campo" id="${c.id}" data-filtro="${c.id}" value="${esc(c.valor)}"
                 placeholder="${esc(c.dica || '')}" autocomplete="off"></label>`;
      }
      if (c.tipo === 'marca') {
        return `<label class="f-marca"><input type="checkbox" data-filtro="${c.id}" id="${c.id}"
          ${c.valor ? 'checked' : ''}> ${esc(c.label)}</label>`;
      }
      return `<label class="f-sel"><span class="rotulo">${esc(c.label)}</span>
        <select class="campo" id="${c.id}" data-filtro="${c.id}">
          ${c.opcoes.map(([v, l]) => `<option value="${esc(v)}"${String(c.valor) === String(v) ? ' selected' : ''}>${esc(l)}</option>`).join('')}
        </select></label>`;
    }).join('')}
    <span class="f-resultado">${esc(contagem)}</span>
  </div>`;
}

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function visiveis() {
  if (S.papel === 'planejamento') return COLABORADORES;
  if (S.papel === 'gestor') {
    const eq = EQUIPES.filter(e => e.gestor === PAPEIS.gestor.nome).map(e => e.id);
    return COLABORADORES.filter(c => eq.includes(c.equipeId));
  }
  const eu = euSou();
  return eu ? [eu] : [];
}

function apar(modalidade, unidadeId) {
  if (modalidade === 'UNIDADE') {

}

function listaAvisos(itens, limite = 30) {
  if (!itens.length) return `<p style="padding:22px;text-align:center;font-size:12.5px;color:var(--muted)">Nenhum conflito ou alerta nesta geração.</p>`;
  const ord = itens.slice().sort((a, b) => (a.nivel === b.nivel ? 0 : a.nivel === 'erro' ? -1 : 1));
  return `<ul class="lista">${ord.slice(0, limite).map(a => `
    <li style="display:flex;gap:10px;align-items:flex-start">
      ${selo(a.nivel === 'erro' ? 'Bloqueante' : 'Aviso', a.nivel === 'erro' ? 'var(--rose)' : 'var(--amber)', a.nivel === 'erro' ? 'var(--rose-bg)' : 'var(--amber-bg)')}

    </li>`).join('')}
    ${ord.length > limite ? `<li style="font-size:11.5px;color:var(--muted)">e mais ${ord.length - limite} item(ns).</li>` : ''}
  </ul>`;
}

const barra = (n, cap, cor) => {
  const pct = cap > 0 ? Math.min(100, (n / cap) * 100) : 0;
  const cheio = cap > 0 && n >= cap;
  return `<div class="barra"><div style="width:${pct}%;background:${cheio ? 'var(--rose)' : cor}"></div></div>`;
};
